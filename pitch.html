<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>用 AI Agent 打造智慧校園：跨校一鍵複製與推廣簡報（播放器版）｜桃園市大溪國中</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=LXGW+Marker+Gothic&family=Iansui&family=Bungee&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F7FA;--ink:#1E293B;--orange:#FF8A3D;--teal:#14B8A6;--teal2:#0F766E;--violet:#8B7CF6;--amber:#F59E0B;--pink:#F48FB1;--navy:#1E3A8A;--sky:#7DB7F0;--paper:#FFF6E3;--paper2:#F3E3C3;--mint:#CCFBF1;--lilac:#EDE9FE;
--h:"LXGW Marker Gothic","Noto Sans TC","Microsoft JhengHei",sans-serif;--b:"Iansui","Noto Sans TC","Microsoft JhengHei",sans-serif;--n:"Bungee","LXGW Marker Gothic",sans-serif}
html,body{margin:0;height:100%;background:#1b1d2e;color:#e8ecf6;font-family:var(--b);overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
/* 上方白色主題導覽列 */
#topBar{height:44px;background:#ffffff;color:#1E293B;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #e2e8f0;font-family:var(--h);font-size:16px;flex:none;z-index:30}
#topBar .tb-title{display:flex;align-items:center;gap:10px;font-weight:bold;letter-spacing:.02em;color:#334155}
#topBar .tb-badge{background:#0F766E;color:#fff;font-size:13px;padding:2px 10px;border-radius:999px;font-weight:normal}
#topBar .tb-links{display:flex;align-items:center;gap:8px;font-size:13px}
#topBar .tb-links a{text-decoration:none;padding:5px 12px;border-radius:999px;font-weight:bold;transition:transform .15s}
#topBar .tb-links a:hover{transform:translateY(-1px)}
#topBar .btn-hub{background:#f1f5f9;color:#0f172a;border:1px solid #cbd5e1}
#topBar .btn-pptx{background:#14B8A6;color:#042f2e}
#topBar .btn-vid{background:#FFE4E6;color:#9F1239;border:1px solid #FECDD3}

#stageWrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:10px}
#stage{position:relative;width:100%;max-width:calc((100vh - 118px)*16/9);aspect-ratio:16/9;overflow:hidden;background:var(--bg);border-radius:12px;box-shadow:0 12px 44px #0009}
.layer{position:absolute;inset:0;overflow:hidden}
.layer>.scaler{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.mask{position:absolute;pointer-events:none;display:none;z-index:20}

/* 下方特效與導播控制列 */
#bar{height:54px;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:15px;background:#141625;border-top:1px solid #2b2f48;flex:none}
#bar button,#bar select{background:#2b2f48;color:#e8ecf6;border:1px solid #444a6e;border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
#bar button:hover,#bar select:hover{border-color:#7DB7F0}
#bar button.on{background:var(--teal);border-color:var(--teal);color:#062b27;font-weight:bold}
#prog{flex:1;position:relative;height:10px;background:#2b2f48;border-radius:6px;cursor:pointer}
#progFill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--teal),var(--violet));border-radius:6px}
.cm{position:absolute;top:-4px;width:3px;height:18px;background:#e8ecf6aa;border-radius:2px}
#count{min-width:68px;text-align:center;font-family:var(--n);font-size:14px}
#toast{position:fixed;left:16px;bottom:66px;font-size:14px;color:#e8ecf6;background:#000b;padding:6px 14px;border-radius:999px;opacity:0;transition:opacity .4s;pointer-events:none;z-index:70}
#notes{position:fixed;right:14px;bottom:66px;width:min(500px,92vw);max-height:48vh;overflow:auto;background:#fffdf6;color:#2B2D42;border-radius:14px;padding:16px 18px;font-size:17px;line-height:1.65;display:none;box-shadow:0 10px 36px #0009;border:3px solid var(--teal);z-index:50}
#notes b{color:#0F766E;font-size:18px}
#ov{position:fixed;inset:0;background:#141625f5;overflow:auto;display:none;z-index:60;padding:22px 26px}
#ov .gt{font-family:var(--h);font-size:28px;margin:4px 0 12px;color:#fff;display:flex;justify-content:space-between;align-items:center}
#ov .ph{font-family:var(--h);font-size:20px;margin:18px 0 8px;padding-left:10px;border-left:6px solid var(--k);color:#fff}
#ov .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
#ov figure{margin:0;cursor:pointer;transition:transform .15s}
#ov figure:hover{transform:translateY(-3px)}
#ov figure .th{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:8px;background:var(--bg);outline:3px solid transparent}
#ov figure.cur .th{outline-color:var(--amber)}
#ov figure .th>div{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;pointer-events:none}
#ov figure>figcaption{font-size:14px;margin-top:5px;color:#cfd3e6}
@media(max-width:700px){#topBar .tb-links{display:none}#bar{font-size:12px;gap:4px;padding:0 6px}#bar button,#bar select{padding:4px 6px}#trSel{max-width:95px}}

/* ===== 投影片 1920x1080 大字視覺系統 ===== */
.sl section{position:relative;width:1920px;height:1080px;box-sizing:border-box;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--b);display:flex;flex-direction:column;justify-content:center;padding:106px 110px 80px}
.sl section.nopad{padding:86px 110px}
.sl h1,.sl h2,.sl h3,.sl p,.sl ul,.sl ol{margin:0}
.sl ul,.sl ol{padding-left:1.15em}
.sl table{border-collapse:collapse;color:inherit;font-family:inherit;text-align:left}
.sl *{box-sizing:border-box}
.sl .tag{position:absolute;left:56px;top:28px;font:32px var(--h);color:var(--teal2);background:#fff;border:3px solid var(--teal);padding:4px 22px;border-radius:999px;z-index:5}
.sl .pg{position:absolute;right:52px;bottom:28px;font:28px var(--n);color:#2B2D4299;z-index:5}
.sl .sign{position:absolute;left:56px;bottom:30px;font:26px var(--b);color:#2B2D42bb;z-index:5;background:#ffffffcc;padding:4px 16px;border-radius:999px}
.sl section.dark .sign{background:#0F172Acc;color:#ffffffcc}
.sl .h{font:116px/1.15 var(--h);letter-spacing:.01em}
.sl .h small{display:block;font-size:48px;color:var(--teal2);margin-bottom:8px}
.sl .sub{font:48px/1.45 var(--b);color:#2B2D42cc;margin-top:18px}
.sl .bl{font:54px/1.55 var(--b);margin-top:34px}
.sl .bl li{margin:14px 0}
.sl .bl li::marker{color:var(--k,var(--teal));font-family:var(--n)}
.sl .bl b{color:var(--teal2);font-family:var(--h);font-weight:normal}
.sl .row{display:flex;gap:54px;align-items:center}
.sl .grow{flex:1;min-width:0}
.sl .bub{position:absolute;background:#fff;color:var(--ink);border:4px solid var(--ink);border-radius:28px;padding:14px 24px;font:42px/1.35 var(--h);white-space:nowrap;box-shadow:6px 6px 0 #2B2D4222;z-index:10}
.sl .bub::after{content:"";position:absolute;width:26px;height:26px;background:#fff;border:4px solid var(--ink);border-top:0;border-left:0;transform:rotate(45deg);bottom:-17px;left:50%}
.sl .ch-reelo{background:var(--reelo) center bottom/contain no-repeat}
.sl .ch-wavi{background:var(--wavi) center bottom/contain no-repeat}
.sl .who{width:400px;aspect-ratio:4/5;flex:none}
.sl .card{background:#fff;border-radius:34px;padding:32px 36px;box-shadow:0 10px 0 var(--k,var(--teal)),0 16px 40px #2B2D4214;border:4px solid var(--k,var(--teal))}
.sl .card .ic{font-size:96px;line-height:1}
.sl .card h3{font:60px/1.25 var(--h);margin:14px 0 10px;color:var(--ink)}
.sl .card p{font:44px/1.45 var(--b);color:#2B2D42dd}
.sl .card p b{color:var(--teal2);font-family:var(--h);font-weight:normal}
.sl .cards{display:grid;gap:38px;margin-top:42px}

/* 專屬元件：編號步驟 */
.sl .steps{margin-top:34px;display:grid;gap:22px}
.sl .step{display:flex;align-items:center;gap:30px;font:50px/1.35 var(--b);background:#fff;padding:18px 28px;border-radius:28px;border:4px solid var(--ink);box-shadow:0 8px 0 #2B2D4218}
.sl .step .no{flex:none;width:86px;height:86px;border-radius:50%;background:var(--k,var(--teal));color:#fff;font:46px/76px var(--n);text-align:center;border:5px solid #2B2D42}
.sl .step b{font-family:var(--h);font-weight:normal;color:var(--teal2)}

/* 專屬元件：指令列 */
.sl .cmd{margin-top:36px;background:#1F2338;border-radius:30px;padding:32px 42px;color:#E8ECF6;font:48px/1.5 var(--b);border:5px solid #2B2D42;box-shadow:0 14px 0 var(--violet)}
.sl .cmd .ln{display:flex;align-items:center;gap:22px;padding:14px 0;border-bottom:2px dashed #ffffff22}
.sl .cmd .ln:last-child{border-bottom:0}
.sl .cmd .sl-k{font:40px var(--n);color:var(--teal);background:#14B8A622;border-radius:14px;padding:6px 20px;white-space:nowrap}
.sl .cmd .ar{color:var(--amber);font-family:var(--n)}
.sl .cmd b{color:#38BDF8;font-family:var(--h);font-weight:normal}

/* 專屬元件：存錢筒用量儀表 */
.sl .meter{display:flex;gap:44px;align-items:stretch;margin-top:40px}
.sl .big{font:210px/1 var(--n);color:var(--teal)}
.sl .gauge{flex:1;background:#fff;border:5px solid var(--ink);border-radius:36px;padding:34px 42px;display:grid;gap:24px}
.sl .gbar{height:44px;border-radius:22px;background:#E5E7F0;overflow:hidden;border:4px solid var(--ink)}
.sl .gbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--amber))}
.sl .glab{font:46px/1.3 var(--b);display:flex;justify-content:space-between}

/* 專屬元件：雙欄比較 */
.sl .cmp{display:grid;grid-template-columns:1fr 1fr;gap:46px;margin-top:36px}
.sl .cmp .col{border-radius:34px;padding:36px 44px;border:5px solid var(--ink);box-shadow:0 12px 0 #1E293B20}
.sl .cmp h3{font:60px/1.2 var(--h);margin-bottom:12px}
.sl .cmp ul{font:46px/1.55 var(--b)}
.sl .cmp b{color:#0F766E;font-family:var(--h);font-weight:normal}

/* 專屬元件：水平時間軸 */
.sl .tl{display:flex;gap:34px;margin-top:50px;position:relative}
.sl .tl::before{content:"";position:absolute;left:0;right:0;top:46px;height:10px;background:var(--ink);border-radius:5px}
.sl .tl .pt{flex:1;position:relative;background:#fff;border:4px solid var(--ink);border-radius:28px;padding:96px 28px 28px;box-shadow:0 10px 0 var(--k)}
.sl .tl .pt::before{content:"";position:absolute;left:32px;top:18px;width:58px;height:58px;border-radius:50%;background:var(--k);border:6px solid var(--ink)}
.sl .tl .dt{font:44px var(--n);color:var(--k)}
.sl .tl p{font:44px/1.45 var(--b);margin-top:10px}
.sl .tl p b{font-family:var(--h);font-weight:normal;color:var(--ink)}

/* 專屬元件：FAQ 問答卡 */
.sl .faq{display:grid;grid-template-columns:1fr 1fr;gap:26px 36px;margin-top:34px}
.sl .faq .q{font:46px/1.3 var(--h);background:var(--lilac);border-radius:26px 26px 26px 6px;padding:18px 24px;border:4px solid var(--violet)}
.sl .faq .a{font:42px/1.4 var(--b);padding:12px 20px 0}
.sl .faq .a b{color:var(--teal2);font-family:var(--h);font-weight:normal}

/* 專屬元件：打勾清單 */
.sl .ck{list-style:none;padding:0;font:50px/1.5 var(--b);margin-top:30px}
.sl .ck li{display:flex;gap:22px;align-items:center;margin:18px 0}
.sl .ck li::before{content:"✓";flex:none;width:64px;height:64px;border-radius:16px;border:5px solid var(--ink);background:var(--mint);color:var(--teal2);font:42px/56px var(--n);text-align:center}
.sl .ck b{color:var(--teal2);font-family:var(--h);font-weight:normal}

/* 專屬元件：深色章節頁與場記板 */
.sl section.dark{background:radial-gradient(circle at 70% 30%,#2E3A7A,#141833);color:#F5F1E8}
.sl section.dark .h{color:#fff}
.sl section.dark .h small{color:var(--mint)}
.sl section.dark .tag{background:#0F172A;color:var(--mint)}
.sl section.dark .pg{color:#ffffffaa}
.sl .poster{position:absolute;inset:0;background:var(--poster) center/cover no-repeat}
.sl .glass{background:#ffffffeb;backdrop-filter:blur(12px);border-radius:44px;padding:50px 58px;border:5px solid #fff;box-shadow:0 24px 64px #1E293B38;width:1080px}
.sl .pill{display:inline-block;font:30px var(--h);padding:6px 20px;border-radius:999px;background:var(--k,var(--teal));color:#fff;margin:0 8px 10px 0}
.sl .three{display:grid;gap:26px;margin-top:36px}
.sl .three div{font:52px/1.3 var(--h);padding:22px 34px;border-radius:28px;background:linear-gradient(90deg,#ffffff1c,#ffffff08);border-left:16px solid var(--k);color:#fff}
.sl .vis{flex:none;border-radius:46px;border:5px solid var(--ink);position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;font:44px/1.35 var(--h);text-align:center;padding:26px;box-shadow:0 14px 0 var(--teal)}
.sl .vis .em{font-size:130px;line-height:1}

.sl .clapb{width:620px;margin-bottom:34px}
.sl .clapt{height:70px;background:repeating-linear-gradient(120deg,#F5F7FA 0 40px,#0F172A 40px 80px);border:6px solid #F5F7FA;border-radius:10px 10px 0 0;transform:rotate(-8deg);transform-origin:0 100%}
.sl .clapbody{background:#0F172A;border:6px solid #F5F7FA;border-top:0;padding:18px 26px;display:flex;justify-content:space-between;align-items:center;font:32px var(--n);color:#CBD5E1}
.sl .clapbody b{font:110px/1 var(--n);color:var(--k,var(--teal));font-weight:normal}

/* 專屬元件：巨型流程管線圖 */
.sl .pipe{display:flex;align-items:center;gap:18px;margin-top:48px}
.sl .pipe div{flex:1;background:#fff;border:5px solid var(--k);border-radius:30px;padding:34px 16px;text-align:center;font-size:80px;box-shadow:0 12px 0 var(--k)}
.sl .pipe b{display:block;font:46px/1.3 var(--h);font-weight:normal;margin-top:12px;color:var(--ink)}
.sl .pipe span{font:64px var(--n);color:var(--ink)}

/* 專屬圖面元件 1：真實系統截圖瀏覽器視窗 (.sgrid / .sframe) */
.sl .sgrid{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:28px}
.sl .sframe{background:#0F172A;border:5px solid var(--ink);border-radius:28px;overflow:hidden;box-shadow:0 12px 0 var(--k,var(--teal));display:flex;flex-direction:column}
.sl .sbar{background:#1E293B;padding:10px 18px;display:flex;align-items:center;gap:10px;border-bottom:3px solid #334155}
.sl .sbar i{width:15px;height:15px;border-radius:50%;background:#EF4444;display:inline-block}
.sl .sbar i:nth-child(2){background:#F59E0B}
.sl .sbar i:nth-child(3){background:#10B981}
.sl .sbar span{font:26px var(--h);color:#E2E8F0;margin-left:6px;white-space:nowrap}
.sl .simg{height:410px;background-size:cover;background-position:center;background-repeat:no-repeat}
.sl .scap{background:#fff;color:var(--ink);padding:16px 22px;font:36px/1.3 var(--b);border-top:4px solid var(--ink);white-space:nowrap}
.sl .scap b{color:var(--teal2);font-family:var(--h);font-weight:normal}

/* 專屬圖面元件 2：擬真 Google 試算表一鍵建立副本 UI (.gsheet) */
.sl .gsheet{width:840px;flex:none;background:#fff;border:5px solid var(--ink);border-radius:28px;overflow:hidden;box-shadow:0 14px 0 var(--teal);position:relative}
.sl .gs-top{background:#107C41;color:#fff;font:32px var(--h);padding:14px 22px;display:flex;align-items:center;gap:12px}
.sl .gs-menu{background:#F1F5F9;padding:10px 22px;display:flex;gap:22px;font:28px var(--h);color:#334155;border-bottom:3px solid #CBD5E1;position:relative;align-items:center}
.sl .gs-menu span{white-space:nowrap}
.sl .gs-menu span:first-child{background:#14B8A6;color:#fff;padding:3px 14px;border-radius:8px}
.sl .gs-drop{position:absolute;left:18px;top:52px;background:#fff;border:4px solid var(--ink);border-radius:18px;box-shadow:0 12px 30px #0004;padding:8px 10px;z-index:10;width:500px}
.sl .gs-drop div{padding:8px 14px;font:28px var(--h);color:#475569;border-radius:10px;white-space:nowrap}
.sl .gs-drop div.active{background:#FEF3C7;color:#B45309;border:3px solid #F59E0B;font-weight:bold}
.sl .gs-grid{width:100%;font:28px var(--b);margin-top:180px}
.sl .gs-grid th{background:#E2E8F0;color:#1E293B;font:28px var(--h);padding:10px 16px;border:2px solid #CBD5E1;white-space:nowrap}
.sl .gs-grid td{padding:12px 16px;border:2px solid #CBD5E1;color:#334155;white-space:nowrap}
.sl .gs-grid td.edit{background:#ECFDF5;color:#0F766E;font-family:var(--h);border:3px solid #14B8A6}

/* 過場遮罩動畫樣式 */
#mClap{inset:0}
#mClap .ct,#mClap .cb{position:absolute;left:-5%;width:110%;height:58%;background:repeating-linear-gradient(120deg,#1E293B 0 7%,#F5F7FA 7% 14%);border:1vw solid #1E293B;box-sizing:border-box}
#mClap .ct{top:0;transform-origin:4% 100%}#mClap .cb{bottom:0;background:#1E293B;display:flex;align-items:center;justify-content:center}
#mClap .cb::after{content:"DSJH AI ✔";font:4vw "Bungee",sans-serif;color:#14B8A6;letter-spacing:.1em}
#mCut{top:-10%;left:-30%;width:160%;height:120%;background:linear-gradient(90deg,#0000 0 6%,#1E293B 6% 94%,#0000 94%),repeating-linear-gradient(180deg,#1E293B 0 3%,#F5F7FA 3% 5%);background-size:100% 100%,7% 8%;background-repeat:no-repeat,repeat-y;background-position:0 0,3% 0}
#mCut::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,#0000 0 3%,#F5F7FA 3% 5%);width:3%;right:3%;left:auto}
#mCut::after{content:"✂";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(90deg);font-size:12vw;color:#FF8A3D}
#mRec{left:50%;top:50%;width:140%;aspect-ratio:1;border-radius:50%;box-sizing:border-box;background:radial-gradient(circle,#1E293B 0 46%,#0F172A 47% 60%,#334155 61% 100%);border:1.4vw solid #0F172A}
#mRec span{position:absolute;inset:0;background:var(--reelo) center/12% no-repeat}
#mRec i{position:absolute;left:44%;top:30%;width:2.5%;aspect-ratio:1;border-radius:50%;background:#EF4444;box-shadow:0 0 2vw #EF4444}
</style>
</head>
<body>
<div id="app">
  <!-- 上方白色主題條 -->
  <div id="topBar">
    <div class="tb-title">
      <span class="tb-badge">桃園市 AI 好幫手決審</span>
      <span>大溪國中智慧校園 AI 協作矩陣：成果如何複製並推廣給各校使用</span>
    </div>
    <div class="tb-links">
      <a class="btn-hub" href="index.html#replication" target="_blank">🌐 開啟主網站跨校複製專區</a>
      <a class="btn-vid" href="index.html" target="_blank">🎬 2:54 實作示範短片</a>
      <a class="btn-pptx" href="dsjh_campus_ai_replication_pitch.pptx" download>📊 下載本機 PPTX 簡報</a>
    </div>
  </div>

  <!-- 中間 16:9 簡報舞台 -->
  <div id="stageWrap"><div id="stage">
    <div class="layer" id="L0"><div class="scaler sl"></div></div>
    <div class="layer" id="L1" style="visibility:hidden"><div class="scaler sl"></div></div>
    <div class="mask" id="mClap"><div class="ct"></div><div class="cb"></div></div>
    <div class="mask" id="mCut"></div>
    <div class="mask" id="mRec"></div>
  </div></div>

  <!-- 下方特效與導播控制列 -->
  <div id="bar">
    <button id="bPrev" title="上一頁（←）">◀</button>
    <span id="count">1 / 20</span>
    <button id="bNext" title="下一頁（→）">▶</button>
    <div id="prog"><div id="progFill" style="width:5%"></div></div>
    <select id="trSel" title="選擇翻頁過場特效">
      <option value="auto">過場：自動編排</option>
      <option value="clap">場記板開拍</option>
      <option value="cut">膠卷剪接</option>
      <option value="rec">鏡頭快門</option>
      <option value="zoom">柔焦縮放</option>

<script>
const zzfxG=(R,volume=1,randomness=0,frequency=220,attack=0,sustain=0,release=.1,shape=0,shapeCurve=1,slide=0,deltaSlide=0,pitchJump=0,pitchJumpTime=0,repeatTime=0,noise=0,modulation=0,bitCrush=0,delay=0,sustainVolume=1,decay=0,tremolo=0,filter=0)=>{
  const PI2=Math.PI*2,abs=Math.abs,sign=v=>v<0?-1:1;
  let startSlide=slide*=500*PI2/R/R,
  startFrequency=frequency*=(1+randomness*2*Math.random()-randomness)*PI2/R,
  b=[],t=0,tm=0,i=0,j=1,r=0,c=0,s=0,f,length,
  quality=2,w=PI2*abs(filter)*2/R,cos=Math.cos(w),alpha=Math.sin(w)/2/quality,
  a0=1+alpha,a1=-2*cos/a0,a2=(1-alpha)/a0,b0=(1+sign(filter)*cos)/2/a0,b1=-(sign(filter)+cos)/a0,b2=b0,x2=0,x1=0,y2=0,y1=0;
  attack=attack*R+9;decay*=R;sustain*=R;release*=R;delay*=R;
  deltaSlide*=500*PI2/R**3;modulation*=PI2/R;pitchJump*=PI2/R;pitchJumpTime*=R;repeatTime=repeatTime*R|0;volume*=.3;
  for(length=attack+decay+sustain+release+delay|0;i<length;b[i++]=s*volume){
    if(!(++c%(bitCrush*100|0))){
      s=shape?shape>1?shape>2?shape>3?Math.sin(t**3):Math.max(Math.min(Math.tan(t),1),-1):1-(2*t/PI2%2+2)%2:1-4*abs(Math.round(t/PI2)-t/PI2):Math.sin(t);
      s=(repeatTime?1-tremolo+tremolo*Math.sin(PI2*i/repeatTime):1)*sign(s)*abs(s)**shapeCurve*
        (i<attack?i/attack:i<attack+decay?1-((i-attack)/decay)*(1-sustainVolume):i<attack+decay+sustain?sustainVolume:i<length-delay?(length-i-delay)/release*sustainVolume:0);
      s=delay?s/2+(delay>i?0:(i<length-delay?1:(length-i)/delay)*b[i-delay|0]/2/volume):s;
      if(filter)s=y1=b2*x2+b1*(x2=x1)+b0*(x1=s)-a2*y2-a1*(y2=y1);
    }
    f=(frequency+=slide+=deltaSlide)*Math.cos(modulation*tm++);
    t+=f+f*noise*Math.sin(i**5);
    if(j&&++j>pitchJumpTime){frequency+=pitchJump;startFrequency+=pitchJump;j=0}
    if(repeatTime&&!(++r%repeatTime)){frequency=startFrequency;slide=startSlide;j=j||1}
  }
  return b;
};
const zzfxMRender=(song,R=44100)=>{
  const [ins,pats,seq,bpm]=song,step=60/bpm/2*R|0,cache={};
  let total=0;seq.forEach(p=>{total+=pats[p][0].length-2});
  const L=new Float32Array(total*step+R*2),Rt=new Float32Array(total*step+R*2);
  let pos=0;
  seq.forEach(p=>{
    const pat=pats[p];
    pat.forEach(ch=>{
      const [ii,pan]=ch;
      for(let k=2;k<ch.length;k++){
        const v=ch[k];if(!v)continue;
        const n=Math.floor(v),vel=(v-n)||1,key=ii+'_'+n;
        let smp=cache[key];
        if(!smp){const l=[...ins[ii]];l[2]*=2**((n-12)/12);smp=cache[key]=zzfxG(R,...l)}
        const o=pos+(k-2)*step,gl=vel*(1-pan)/2+vel*.25,gr=vel*(1+pan)/2+vel*.25;
        for(let q=0;q<smp.length&&o+q<L.length;q++){L[o+q]+=smp[q]*gl;Rt[o+q]+=smp[q]*gr}
      }
    });
    pos+=(pat[0].length-2)*step;
  });
  const len=pos;
  for(let q=len;q<L.length;q++){L[q-len]+=L[q];Rt[q-len]+=Rt[q]}
  return [L.subarray(0,len),Rt.subarray(0,len)];
};

-size:130px\">零門檻複製架構</h1><p class=\"sub\" style=\"color:#ffffffcc\">1-3-5 快速部署法・試算表即後台・雙校共創實證</p></div><div class=\"who ch-wavi\" style=\"position:relative\"><div class=\"bub\" style=\"top:-96px;left:10px\">免工程師！</div></div></div><div class=\"tag\">二、零門檻複製架構</div><div class=\"pg\">7</div></section>"}, {"id": 8, "title": "1-3-5 極速複製管線", "layout": "巨型流程管線圖（專屬）", "notes": "【1:45-2:05 1-3-5 複製法】請看這條複製管線：外校老師只要「1 鍵建立 Google 試算表副本」→「3 步換上自己學校的名稱與題庫」→「5 分鐘內就能取得專屬網址正式上線」，而且後續主機與授權費用永遠是「$0 元」！", "html": "<section style=\"--k:#8B7CF6\"><h1 class=\"h\" style=\"font-size:106px\"><small>獨創「1-3-5 跨校快速複製法」</small>從複製到上線，只要 5 分鐘</h1><div class=\"pipe\"><div style=\"--k:var(--teal)\">1️⃣<b>1 鍵建副本<br><small style=\"font-size:34px;color:#475569\">試算表＋程式打包</small></b></div><span>→</span><div style=\"--k:var(--violet)\">3️⃣<b>3 步換校名<br><small style=\"font-size:34px;color:#475569\">改名單與 CSV 題庫</small></b></div><span>→</span><div style=\"--k:var(--amber)\">5️⃣<b>5 分鐘上線<br><small style=\"font-size:34px;color:#475569\">產出該校專屬網址</small></b></div><span>→</span><div style=\"--k:var(--orange)\">💰<b>$0 元維運<br><small style=\"font-size:34px;color:#475569\">免主機・免工程師</small></b></div></div><p class=\"sub\">✨ 全系統採用 Google Workspace 教育雲與 GitHub Pages 免費 CDN</p><div class=\"tag\">二、零門檻複製架構</div><div class=\"pg\">8</div></section>"}, {"id": 9, "title": "會用試算表，就會管後台", "layout": "擬真 Google 試算表 UI 圖解（專屬）", "notes": "【2:05-2:30 試算表即後台】為什麼外校不用怕沒人維護？因為我們首創「試算表即後台（Spreadsheet-as-CMS）」。如右圖所示：外校組長打開我們的公版母版，點選「檔案 ➔ 建立副本」，底層的 Apps Script 程式碼就自動跟著複製過去！以後改社團名額、改題目，直接在試算表打字就全站同步！", "html": "<section style=\"--k:#8B7CF6\"><div class=\"row\" style=\"gap:44px\"><div class=\"grow\"><h1 class=\"h\" style=\"font-size:94px\"><small>首創 Spreadsheet-as-CMS 架構</small>會用試算表，<br>就會管系統後台！</h1><ul class=\"bl\" style=\"font-size:46px;margin-top:28px\"><li>點<b>「檔案 ➔ 建立副本」</b>連程式打包</li><li>改名額、改題庫＝<b>直接在格子打字</b></li><li>學生個資 <b>100% 存貴校自有雲端</b></li></ul></div><div class=\"gsheet\"><div class=\"gs-top\">📊 公版母版_智慧社團與自主學習後台.xlsx</div><div class=\"gs-menu\"><span>檔案 (F) ▾</span><span>編輯</span><span>檢視</span><span>擴充功能 (Apps Script ✔)</span><div class=\"gs-drop\"><div>📄 新增試算表</div><div class=\"active\">📑 建立副本 (Make a copy) 👈 點這一下！</div><div>⬇️ 匯出 CSV 題庫</div></div></div><table class=\"gs-grid\"><tr><th>A 設定項目</th><th>B 學校參數（直接打字修改）</th><th>C 狀態</th></tr><tr><td>學校名稱</td><td class=\"edit\">桃園市立 〇〇國民中學 ✎</td><td>🟢 即時同步</td></tr><tr><td>AI 機器人社</td><td>名額上限：30 人</td><td>🟢 開放選填</td></tr><tr><td>資料儲存區</td><td>貴校自有 Google Drive</td><td>🔒 獨立隔離</td></tr></table></div></div><div class=\"tag\">二、零門檻複製架構</div><div class=\"pg\">9</div></section>"}, {"id": 10, "title": "東興國中 × 大溪國中 雙校共創", "layout": "雙欄共創演進圖", "notes": "【2:30-2:50 雙校共創實證】更重要的是，我們的「跨校複製」不是紙上談兵，而是已經發生的事實！模組三的 DDP 知識對決，正是源自桃園市東興國中鍾老師的原創啟發，大溪國中游貿仁與林佳均老師接手後，改編升級為雙人同屏對決與跨科題庫系統。這證明了本架構具備 100% 跨校無縫移植與二次創新的基因！", "html": "<section style=\"--k:#8B7CF6\"><h1 class=\"h\" style=\"font-size:98px\"><small>不是紙上談兵，我們本身就是跨校複製實證！</small>東興國中 × 大溪國中 雙校共創</h1><div class=\"cmp\"><div class=\"col\" style=\"background:var(--mint);position:relative\"><h3>🌱 源頭啟發：東興國中</h3><p style=\"font-size:40px;color:#0F766E;font-weight:bold;margin-bottom:12px\">鍾老師 原創構想無私分享</p><ul><li>奠定網頁遊戲化素養原型</li><li>純前端免安裝輕量架構</li><li>開啟跨校開源共創第一步</li></ul></div><div class=\"col\" style=\"background:var(--lilac);position:relative\"><h3>🚀 改編進化：大溪國中</h3><p style=\"font-size:40px;color:#6D28D9;font-weight:bold;margin-bottom:12px\">游貿仁 老師 × 林佳均 老師</p><ul><li>升級 <b>P1 vs P2 雙人同屏對決</b></li><li>支援<b>各科 CSV 題庫一鍵匯入</b></li><li>整合進全校 <b>6 合 1 AI 協作矩陣</b></li></ul></div></div><div class=\"tag\">二、零門檻複製架構</div><div class=\"pg\">10</div></section>"}, {"id": 11, "title": "第三章：三級推廣授權包", "layout": "場記板章節頁（專屬）", "notes": "【2:50-3:00 第三章引言】為了讓不同規模、不同技術背景的學校都能輕鬆導入，我們把成果封裝成「Level 1、Level 2、Level 3 三級推廣授權包」，像點餐一樣自由選擇！", "html": "<section class=\"dark\" style=\"--k:#F59E0B\"><div class=\"row\"><div class=\"grow\"><div class=\"clapb\"><div class=\"clapt\"></div><div class=\"clapbody\"><span>SCENE</span><b>CH3</b><span>TAKE 1</span></div></div><h1 class=\"h\" style=\"font-size:130px\">三級推廣授權包</h1><p class=\"sub\" style=\"color:#ffffffcc\">Level 1 科任教師・Level 2 行政處室・Level 3 全校資訊組</p></div><div class=\"who ch-reelo\" style=\"position:relative\"><div class=\"bub\" style=\"top:-96px;left:10px\">任選一包！</div></div></div><div class=\"tag\">三、三級推廣授權包</div><div class=\"pg\">11</div></section>"}, {"id": 12, "title": "Level 1：0 分鐘即開即用包", "layout": "編號步驟＋視覺圖卡", "notes": "【3:00-3:20 Level 1 科任包】第一包是給全桃園「一般科任老師與導師」的 Level 1 即開即用包：部署時間 0 分鐘！老師不用找資訊組，直接點開我們的公開網址，匯入自己科目的 Excel/CSV 題庫，下一節課就能在教室大屏玩雙人對決或體感塔防！", "html": "<section style=\"--k:#14B8A6\"><div class=\"row\"><div class=\"grow\"><h1 class=\"h\" style=\"font-size:94px\"><small>🟢 Level 1｜給各校科任教師、班級導師</small>0 分鐘部署：點開直接上課</h1><div class=\"steps\"><div class=\"step\"><span class=\"no\" style=\"--k:var(--teal)\">1</span><span>點開公開網址，或存單一 <b>.html</b> 到桌面</span></div><div class=\"step\"><span class=\"no\" style=\"--k:var(--teal)\">2</span><span>匯入各科 <b>CSV 題庫</b>（國英數自社皆可）</span></div><div class=\"step\"><span class=\"no\" style=\"--k:var(--teal)\">3</span><span>教室大屏、平板 <b>免安裝直接上課</b></span></div></div></div><div class=\"vis\" style=\"background:var(--mint);width:520px;height:520px\"><div class=\"em\">⚡</div><div style=\"font-size:72px;color:#0F766E;font-family:var(--n)\">0 MIN</div><div>免設定・即開即用<br><span style=\"font-size:36px;color:#475569\">體感塔防／雙人對決／胸章</span></div></div></div><div class=\"tag\">三、三級推廣授權包</div><div class=\"pg\">12</div></section>"}, {"id": 13, "title": "Level 2：3 分鐘行政處室副本包", "layout": "編號步驟＋吉祥物", "notes": "【3:20-3:40 Level 2 處室包】第二包是給各校「教務處、學務處組長」的 Level 2 行政處室副本包：只要 3 分鐘！照著我們網站上的三步驟精靈，建立試算表副本、按一下部署網頁應用程式，就擁有該校獨立的「免登入自主學習收件系統」與「社團選社系統」！", "html": "<section style=\"--k:#0EA5E9\"><div class=\"row\"><div class=\"grow\"><h1 class=\"h\" style=\"font-size:94px\"><small>🔵 Level 2｜給各校教務處、學務處、訓育組</small>3 分鐘部署：試算表建副本</h1><div class=\"steps\"><div class=\"step\"><span class=\"no\" style=\"--k:#0EA5E9\">1</span><span>開啟公版母版，點<b>「檔案 ➔ 建立副本」</b></span></div><div class=\"step\"><span class=\"no\" style=\"--k:#0EA5E9\">2</span><span>點選<b>「部署 ➔ 新增網頁應用程式」</b></span></div><div class=\"step\"><span class=\"no\" style=\"--k:#0EA5E9\">3</span><span>取得貴校專屬網址，<b>個資 100% 獨立</b></span></div></div></div><div class=\"who ch-wavi\" style=\"position:relative;width:340px\"><div class=\"bub\" style=\"top:-96px;left:0px\">處室最愛！</div></div></div><div class=\"tag\">三、三級推廣授權包</div><div class=\"pg\">13</div></section>"}, {"id": 14, "title": "Level 3：5 分鐘全校旗艦開源包", "layout": "指令列步驟＋吉祥物（專屬）", "notes": "【3:40-3:55 Level 3 全校包】第三包是給各校「資訊組長」的 Level 3 全校旗艦開源包：我們將全部 6 大子系統原始碼開源在 GitHub。外校資訊組長只要點右上角 Fork、開啟 GitHub Pages、再把「大溪國中」四個字批次取代成貴校校名，5 分鐘就能把整座 AI 入口網搬回自己學校！", "html": "<section style=\"--k:#8B7CF6\"><div class=\"row\"><div class=\"grow\"><h1 class=\"h\" style=\"font-size:94px\"><small>🟣 Level 3｜給各校資訊組長、縣市數辦中心</small>5 分鐘部署：GitHub 整站 Fork</h1><div class=\"cmd\"><div class=\"ln\"><span class=\"sl-k\">STEP 1</span><span class=\"ar\">➔</span><span>點 GitHub 右上角 <b>「Fork」</b> 複製整套倉庫</span></div><div class=\"ln\"><span class=\"sl-k\">STEP 2</span><span class=\"ar\">➔</span><span>於 Settings 啟用 <b>GitHub Pages</b> 免費代管</span></div><div class=\"ln\"><span class=\"sl-k\">STEP 3</span><span class=\"ar\">➔</span><span>批次取代 <b>「大溪國中 ➔ 〇〇國中」</b> 整站上線！</span></div></div></div><div class=\"who ch-reelo\" style=\"position:relative;width:330px\"><div class=\"bub\" style=\"top:-96px;left:10px\">整站搬走！</div></div></div><div class=\"tag\">三、三級推廣授權包</div><div class=\"pg\">14</div></section>"}, {"id": 15, "title": "跨校一鍵複製中心（主網站實裝）", "layout": "滿版真實網頁畫面圖解", "notes": "【3:55-4:10 網站實裝證明】我們不只做簡報，更已經把「跨校一鍵複製與推廣中心」直接建置在參賽主網站上！委員現在點進我們網站的「跨校複製專區」，就能直接下載 CSV 題庫範本、開啟 3 分鐘試算表副本精靈、或一鍵 Fork 全站原始碼！", "html": "<section style=\"--k:#F59E0B\"><div class=\"row\" style=\"gap:44px\"><div style=\"width:650px;flex:none\"><h1 class=\"h\" style=\"font-size:90px\"><small>已實裝於參賽主網站！</small>跨校複製中心<br>現在就能領取</h1><ul class=\"ck\" style=\"font-size:44px;margin-top:28px\"><li><span><b>CSV 題庫範本</b> 一鍵下載</span></li><li><span><b>3 分鐘試算表副本</b> SOP</span></li><li><span><b>GitHub 開源倉庫</b> 一鍵直連</span></li></ul></div><div class=\"sframe\" style=\"flex:1;--k:var(--teal)\"><div class=\"sbar\"><i></i><i></i><i></i><span>https://coolokey.github.io/dsjh-campus-ai-hub/#replication</span></div><div class=\"simg\" style=\"height:540px;background-image:var(--img-hub);background-position:top center\"></div></div></div><div class=\"tag\">三、三級推廣授權包</div><div class=\"pg\">15</div></section>"}, {"id": 16, "title": "第四章：全市推廣藍圖與效益", "layout": "場記板章節頁（專屬）", "notes": "【4:10-4:18 第四章引言】最後一章，向委員報告我們從「雙校共創」邁向「全桃園市普及」的三階段推廣藍圖與具體效益。", "html": "<section class=\"dark\" style=\"--k:#0F766E\"><div class=\"row\"><div class=\"grow\"><div class=\"clapb\"><div class=\"clapt\"></div><div class=\"clapbody\"><span>SCENE</span><b>CH4</b><span>TAKE 1</span></div></div><h1 class=\"h\" style=\"font-size:130px\">全市推廣藍圖</h1><p class=\"sub\" style=\"color:#ffffffcc\">推廣三部曲・量化效益儀表・常見問答與結語</p></div><div class=\"who ch-reelo\" style=\"position:relative\"><div class=\"bub\" style=\"top:-96px;left:0px\">推向全桃園！</div></div></div><div class=\"tag\">四、全市推廣藍圖</div><div class=\"pg\">16</div></section>"}, {"id": 17, "title": "桃園市跨校推廣三部曲", "layout": "水平時間軸圖解（專屬）", "notes": "【4:18-4:32 推廣三部曲】我們的全市推廣分為三部曲：第一階段「雙校實證」（東興國中與大溪國中跨校共創與校內百師實測，目前已 100% 完成）；第二階段「種子工作坊」（結合桃園數辦與領域輔導團研習，手把手帶各校老師 30 分鐘建置完畢）；第三階段「全市題庫共享池」（匯聚桃園各校老師自製的 CSV 題庫，形成跨校共好生態系）。", "html": "<section style=\"--k:#0F766E\"><h1 class=\"h\" style=\"font-size:102px\"><small>從雙校實證走向全桃園普及</small>桃園市跨校推廣三部曲</h1><div class=\"tl\"><div class=\"pt\" style=\"--k:var(--teal)\"><div class=\"dt\">STAGE 1｜已完成 ✔</div><p><b>雙校共創實證</b><br>東興×大溪跨校移植<br>封裝三級懶人包</p></div><div class=\"pt\" style=\"--k:var(--violet)\"><div class=\"dt\">STAGE 2｜近程推廣</div><p><b>數辦種子工作坊</b><br>結合輔導團研習<br>30分鐘帶走整套系統</p></div><div class=\"pt\" style=\"--k:var(--orange)\"><div class=\"dt\">STAGE 3｜中長程生態</div><p><b>全市題庫共享池</b><br>各校交換 CSV 題庫<br>全桃開源共好生態</p></div></div><div class=\"tag\">四、全市推廣藍圖</div><div class=\"pg\">17</div></section>"}, {"id": 18, "title": "零預算門檻，創造最大減量效益", "layout": "存錢筒用量儀表（專屬）", "notes": "【4:32-4:45 量化效益】每複製到一所新學校，就能立即創造四個量化效益：主機與軟體授權費 $0 元、行政重複工時節省 90% 以上、社團前三志願滿足率達 95% 以上、跨校移轉時間只要 5 分鐘！", "html": "<section style=\"--k:#0F766E\"><h1 class=\"h\" style=\"font-size:100px\"><small>每複製到一所學校，立即可見的改變</small>零預算門檻，創造最大減量效益</h1><div class=\"meter\"><div style=\"display:flex;flex-direction:column;justify-content:center;align-items:center;background:#fff;border:5px solid var(--ink);border-radius:36px;padding:30px 46px;box-shadow:0 12px 0 var(--teal)\"><div class=\"big\">$0</div><div style=\"font:48px var(--h);color:var(--ink);margin-top:10px\">伺服器與授權費</div></div><div class=\"gauge\"><div><div class=\"glab\"><span>⚡ 行政重複工時節省（20分➔2分）</span><b style=\"color:var(--teal2)\">90%+</b></div><div class=\"gbar\"><i style=\"width:92%\"></i></div></div><div><div class=\"glab\"><span>🎯 社團前三志願分發滿足率</span><b style=\"color:var(--violet)\">95%+</b></div><div class=\"gbar\"><i style=\"width:95%;background:linear-gradient(90deg,var(--violet),var(--teal))\"></i></div></div><div><div class=\"glab\"><span>🚀 外校一鍵複製上線速度（5 分鐘）</span><b style=\"color:var(--orange)\">100%</b></div><div class=\"gbar\"><i style=\"width:100%;background:linear-gradient(90deg,var(--amber),var(--orange))\"></i></div></div></div></div><div class=\"tag\">四、全市推廣藍圖</div><div class=\"pg\">18</div></section>"}, {"id": 19, "title": "外校老師最常問的四件事", "layout": "視覺問答卡", "notes": "【4:45-4:52 常見問答】我們也整理了外校老師最常問的四個問題：沒經費買主機？全系統永遠 $0 元；資訊組長調職變孤兒？試算表打字就能管；學生個資安全嗎？建立副本後 100% 存在各校自有雲端；只能考數學嗎？匯入 CSV 各科都能用！", "html": "<section style=\"--k:#0F766E\"><h1 class=\"h\" style=\"font-size:100px\"><small>消除他校導入疑慮</small>外校老師最常問的四件事</h1><div class=\"faq\"><div><div class=\"q\">Q1：學校沒經費買主機怎麼辦？</div><div class=\"a\">✔ 跑在 Google 教育雲與 GitHub，<b>永遠 $0 元</b>！</div></div><div><div class=\"q\">Q2：資訊組長調職會變孤兒系統嗎？</div><div class=\"a\">✔ <b>試算表就是後台</b>，一般行政老師打字就能管！</div></div><div><div class=\"q\">Q3：學生作業個資會傳回大溪國中嗎？</div><div class=\ function bgmBuf(i){if(bgmBufs[i])return bgmBufs[i];const [L,R]=zzfxMRender(BGM[i].song,ac.sampleRate);let q=0,pk=0;for(let k=0;k<L.length;k++){q+=L[k]*L[k]+R[k]*R[k];pk=Math.max(pk,Math.abs(L[k]),Math.abs(R[k]))}const rms=Math.sqrt(q/L.length/2);let g=.1/rms;if(pk*g>.95)g=.95/pk;const b=ac.createBuffer(2,L.length,ac.sampleRate);const l=b.getChannelData(0),r=b.getChannelData(1);for(let k=0;k<L.length;k++){l[k]=L[k]*g;r[k]=R[k]*g}return bgmBufs[i]=b}
function toast(t){const e=$('#toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,2600)}
function bgmPlay(i){if(!ac||!bgmOn)return;if(i===bgmIdx&&bgmSrc)return;const old=bgmSrc;bgmIdx=i;const g=ac.createGain();g.gain.value=0;g.connect(bgmGain);const s=ac.createBufferSource();s.buffer=bgmBuf(i);s.loop=true;s.connect(g);s.start();const t=ac.currentTime;g.gain.linearRampToValueAtTime(1,t+1.2);if(old){old._g.gain.setValueAtTime(old._g.gain.value,t);old._g.gain.linearRampToValueAtTime(0,t+1.2);old.stop(t+1.3)}s._g=g;bgmSrc=s;toast('♪ '+BGM[i].name)}
function bgmStop(){if(bgmSrc){const t=ac.currentTime;bgmSrc._g.gain.linearRampToValueAtTime(0,t+.6);bgmSrc.stop(t+.7);bgmSrc=null;bgmIdx=-1}}
function bgmFollow(){if(bgmOn)bgmPlay(PARTS[partOf(cur)].bgm)}
function setS(v,quiet){sfxOn=v;store.set('sfx',v);$('#bS').classList.toggle('on',v);if(v){ctx();if(!quiet){sfx('on');toast('🔊 翻頁音效已開啟')}};if(!v&&!quiet)toast('🔇 翻頁音效已關閉')}
function setM(v){bgmOn=v;store.set('bgm',v);$('#bM').classList.toggle('on',v);if(v){ctx();toast('♪ 背景音樂準備中…');setTimeout(bgmFollow,30)}else if(ac){bgmStop();toast('🔇 背景音樂已關閉')}}
function vol(d){bgmVol=Math.max(.02,Math.min(1.2,bgmVol*(d>0?1.41:1/1.41)));store.set('bgmvol_v1',bgmVol);if(bgmGain)bgmGain.gain.value=bgmVol;toast('背景音樂音量 '+(20*Math.log10(bgmVol/.3)).toFixed(0)+' dB')}
const wake=()=>{removeEventListener('pointerdown',wake);removeEventListener('keydown',wake);if(store.get('sfx',true))setS(true,true);if(store.get('bgm',false))setM(true)};
addEventListener('pointerdown',wake);addEventListener('keydown',wake);

const at=(a,t,cb)=>{(function f(){(a.currentTime||0)>=t?cb():requestAnimationFrame(f)})()};
const A=(el,kf,o)=>el.animate(kf,Object.assign({fill:'both',easing:'cubic-bezier(.6,0,.3,1)'},o));
const MASKS={
 clap(dir,onSwap){const m=$('#mClap'),t=m.querySelector('.ct'),b=m.querySelector('.cb');m.style.display='block';const D=1000;sfx('clap',380);sfx('clapw',395);
   const a=A(t,[{transform:'translateY(-105%) rotate(-14deg)'},{transform:'translateY(0) rotate(-14deg)',offset:.3},{transform:'translateY(0) rotate(0)',offset:.4},{transform:'translateY(0) rotate(0)',offset:.62},{transform:'translateY(-105%) rotate(0)'}],{duration:D});
   const a2=A(b,[{transform:'translateY(105%)'},{transform:'translateY(0)',offset:.3},{transform:'translateY(0)',offset:.62},{transform:'translateY(105%)'}],{duration:D});
   at(a,D*.51,onSwap);return a.finished.then(()=>{a.cancel();a2.cancel();m.style.display='none'})},
 cut(dir,onSwap){const m=$('#mCut');m.style.display='block';const s=dir>0?1:-1,D=1000;sfx('whir');sfx('snip1',430);sfx('snip2',500);
   const a=A(m,[{transform:`translateX(${-110*s}%)`},{transform:'translateX(0)',offset:.42},{transform:'translateX(0)',offset:.6},{transform:`translateX(${110*s}%)`}],{duration:D});at(a,D*.51,onSwap);return a.finished.then(()=>{a.cancel();m.style.display='none'})},
 rec(dir,onSwap){const m=$('#mRec');m.innerHTML='<span></span><i></i>';m.style.display='block';const D=1100;sfx('shut');sfx('rec',500);
   const a=A(m,[{transform:'translate(-50%,-50%) scale(.04)',opacity:1},{transform:'translate(-50%,-50%) scale(1)',offset:.4},{transform:'translate(-50%,-50%) scale(1)',offset:.66,opacity:1},{transform:`translate(-50%,-50%) scale(1.15) rotate(${dir>0?30:-30}deg)`,opacity:0}],{duration:D});at(a,D*.53,onSwap);return a.finished.then(()=>{a.cancel();m.style.display='none'})},
};
function act(kind,newL,oldL,dir,withSound=true){
  const D=reduce?250:700;
  if(reduce||kind==='fade'){return A(newL,[{opacity:0},{opacity:1}],{duration:D}).finished}
  if(kind==='zoom'){withSound&&sfx('zoom');A(oldL,[{opacity:1},{opacity:0}],{duration:D});return A(newL,[{opacity:0,transform:'scale(1.05)',filter:'blur(10px)'},{opacity:1,transform:'scale(1)',filter:'blur(0)'}],{duration:D}).finished}
  if(kind==='push'){withSound&&sfx('push');const s=dir>0?1:-1;A(oldL,[{transform:'translateX(0)'},{transform:`translateX(${-100*s}%)`}],{duration:D});return A(newL,[{transform:`translateX(${100*s}%)`},{transform:'translateX(0)'}],{duration:D}).finished}
  if(kind==='iris'){withSound&&sfx('iris');return A(newL,[{clipPath:'circle(0% at 50% 50%)'},{clipPath:'circle(75% at 50% 50%)'}],{duration:D}).finished}
  return Promise.resolve();
}
function trFor(from,to){const sel=$('#trSel').value;if(sel!=='auto')return sel.split('+');const k=to>from?to:from;return (PLAN[k]||['zoom'])}
function go(i,dirHint){
  if(busy||i<0||i>=SLIDES.length||i===cur)return;
  busy=true;const dir=dirHint||(i>cur?1:-1);const kinds=trFor(cur,i);
  const oldL=layers[front],newL=layers[1-front];fill(newL,i);fit();
  newL.style.zIndex=2;oldL.style.zIndex=1;newL.style.visibility='hidden';
  const finish=()=>{oldL.style.visibility='hidden';newL.getAnimations().forEach(a=>a.cancel());oldL.getAnimations().forEach(a=>a.cancel());oldL.style.transform='';front=1-front;cur=i;busy=false;ui()};
  const swap=(rest)=>{newL.style.visibility='visible';const p=rest.length?Promise.all(rest.map(k=>act(k,newL,oldL,dir))):Promise.resolve();return p};
  if(MASKS[kinds[0]]&&!reduce){let sw;const sp=new Promise(r=>sw=r);MASKS[kinds[0]](dir,()=>{swap(kinds.slice(1)).then(sw)});Promise.all([sp]).then(()=>setTimeout(finish,40))}
  else{const k=MASKS[kinds[0]]?['fade']:kinds;newL.style.visibility='visible';Promise.all(k.map(x=>act(x,newL,oldL,dir))).then(finish)}
  cur=i;updateBar(i);
}
function updateBar(i){$('#count').textContent=(i+1)+' / '+SLIDES.length;$('#progFill').style.width=((i+1)/SLIDES.length*100)+'%'}
function ui(){updateBar(cur);(()=>{try{history.replaceState(null,'','#p'+(cur+1))}catch(e){}})();$('#notes').innerHTML='<b>第 '+(cur+1)+' 頁｜'+SLIDES[cur].layout+'</b><br>'+SLIDES[cur].notes;bgmFollow();document.querySelectorAll('#ov figure').forEach((f,k)=>f.classList.toggle('cur',k===cur))}

PARTS.forEach(p=>{const m=document.createElement('div');m.className='cm';m.style.left=(p.start/SLIDES.length*100)+'%';m.title=p.name;$('#prog').appendChild(m)});
$('#prog').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();go(Math.min(SLIDES.length-1,Math.floor((e.clientX-r.left)/r.width*SLIDES.length)))};

function buildOv(){const ov=$('#ov');let h='<div class="gt"><span>📑 簡報章節總覽（共 '+SLIDES.length+' 頁，點選任一頁直接跳轉）</span><button onclick="toggleOv(false)" style="background:#ef4444;color:#fff;border:0;padding:6px 16px;border-radius:8px;cursor:pointer;font-size:16px">✕ 關閉 (Esc)</button></div>';PARTS.forEach((p,k)=>{const end=k+1<PARTS.length?PARTS[k+1].start:SLIDES.length;h+=`<div class="ph" style="--k:${p.color}">${p.name}</div><div class="grid">`;for(let i=p.start;i<end;i++)h+=`<figure data-i="${i}"><div class="th"><div class="sl">${SLIDES[i].html}</div></div><figcaption>${i+1}. ${SLIDES[i].title}</figcaption></figure>`;h+='</div>'});ov.innerHTML=h;ov.querySelectorAll('figure').forEach(f=>f.onclick=()=>{toggleOv(false);go(+f.dataset.i)})}
function scaleOv(){document.querySelectorAll('#ov .th').forEach(t=>t.firstChild.style.transform=`scale(${t.clientWidth/1920})`)}
function toggleOv(v){const ov=$('#ov');v=v===undefined?ov.style.display!=='block':v;if(v&&!ov.innerHTML)buildOv();ov.style.display=v?'block':'none';if(v){scaleOv();ui()}}
addEventListener('resize',()=>{if($('#ov').style.display==='block')scaleOv()});
function toggleNotes(){const n=$('#notes');const show=n.style.display!=='block';n.style.display=show?'block':'none';$('#bN').classList.toggle('on',show)}
function fs(){if(!document.fullscreenElement)document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen()}
$('#bPrev').onclick=()=>go(cur-1);$('#bNext').onclick=()=>go(cur+1);
$('#bS').onclick=()=>setS(!sfxOn);$('#bM').onclick=()=>setM(!bgmOn);$('#bG').onclick=()=>toggleOv();$('#bN').onclick=toggleNotes;$('#bF').onclick=fs;
$('#trSel').value=store.get('tr','auto');$('#trSel').onchange=e=>{store.set('tr',e.target.value);e.target.blur()};
addEventListener('keydown',e=>{if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return;const k=e.key;
 if(k==='ArrowRight'||k===' '||k==='PageDown'){e.preventDefault();go(cur+1)}else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();go(cur-1)}
 else if(k==='Home')go(0);else if(k==='End')go(SLIDES.length-1);
 else if(k==='s'||k==='S')setS(!sfxOn);else if(k==='m'||k==='M')setM(!bgmOn);else if(k==='g'||k==='G')toggleOv();else if(k==='Escape')toggleOv(false);
 else if(k==='n'||k==='N')toggleNotes();else if(k==='f'||k==='F')fs();else if(k===']')vol(1);else if(k==='[')vol(-1)});
stage.addEventListener('click',e=>{if(e.target.closest('a,button'))return;const r=stage.getBoundingClientRect();go(e.clientX-r.left<r.width*.3?cur-1:cur+1)});
let tx=null;stage.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});stage.addEventListener('touchend',e=>{if(tx===null)return;const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)go(cur+(d<0?1:-1));tx=null},{passive:true});

const m0=location.hash.match(/^#p(\d+)/);cur=m0?Math.min(SLIDES.length-1,Math.max(0,m0[1]-1)):0;
fill(layers[0],cur);layers[1].style.visibility='hidden';fit();ui();
</script>
</body>
</html>
