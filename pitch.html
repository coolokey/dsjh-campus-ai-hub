<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>用 AI Agent 打造智慧校園：跨校一鍵複製與推廣簡報（播放器版）｜桃園市大溪國中</title>
<style>
:root, [data-theme="teal"]{
  --bg:#F5F7FA;--ink:#1E293B;--card-bg:#FFFFFF;--orange:#FF8A3D;--teal:#14B8A6;--teal2:#0F766E;--violet:#8B7CF6;--amber:#F59E0B;--pink:#F48FB1;--navy:#1E3A8A;--sky:#7DB7F0;--paper:#FFF6E3;--paper2:#F3E3C3;--mint:#CCFBF1;--lilac:#EDE9FE;
  --dark-grad:radial-gradient(circle at 70% 30%,#2E3A7A,#141833);
  --h:"標楷體","DFKai-SB","BiauKai","Kaiti TC","TW-Kai",serif;--b:"標楷體","DFKai-SB","BiauKai","Kaiti TC","TW-Kai",serif;--n:"標楷體","DFKai-SB","BiauKai","Kaiti TC","TW-Kai",serif
}
/* 配色二：皇家藏青 × 榮耀金（公部門沉穩獲獎風） */
[data-theme="royal"]{
  --bg:#F4F7FB;--ink:#0F172A;--card-bg:#FFFFFF;--orange:#D97706;--teal:#2563EB;--teal2:#1E40AF;--violet:#0284C7;--amber:#B45309;--mint:#DBEAFE;--lilac:#FEF3C7;
  --dark-grad:radial-gradient(circle at 70% 30%,#1E3A8A,#090D16);
}
/* 配色三：大溪木藝暖陽 × 森林綠（溫潤人文書院風） */
[data-theme="wood"]{
  --bg:#FDF8F0;--ink:#2C1E16;--card-bg:#FFFDF9;--orange:#C2410C;--teal:#B45309;--teal2:#92400E;--violet:#15803D;--amber:#D97706;--mint:#FEF3C7;--lilac:#DCFCE7;
  --dark-grad:radial-gradient(circle at 70% 30%,#5C2D0C,#1C130E);
}
/* 配色四：莫蘭迪紫 × 玫瑰粉（柔和親師美學風） */
[data-theme="violet"]{
  --bg:#FAF6FE;--ink:#2D1B4E;--card-bg:#FFFFFF;--orange:#DB2777;--teal:#7C3AED;--teal2:#5B21B6;--violet:#0D9488;--amber:#E11D48;--mint:#F3E8FF;--lilac:#FCE7F3;
  --dark-grad:radial-gradient(circle at 70% 30%,#4C1D95,#1E1035);
}
/* 配色五：極光深色黑金（高對比科技大屏風） */
[data-theme="dark"]{
  --bg:#0F172A;--ink:#F8FAFC;--card-bg:#1E293B;--orange:#FB923C;--teal:#2DD4BF;--teal2:#38BDF8;--violet:#A78BFA;--amber:#FBBF24;--mint:#134E4A;--lilac:#312E81;
  --dark-grad:radial-gradient(circle at 70% 30%,#0F766E,#020617);
}
html,body{margin:0;height:100%;background:#1b1d2e;color:#e8ecf6;font-family:var(--b);overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
/* 上方白色主題導覽列 */
#topBar{height:44px;background:#ffffff;color:#1E293B;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #e2e8f0;font-family:var(--h);font-size:16px;flex:none;z-index:30}
#topBar .tb-title{display:flex;align-items:center;gap:10px;font-weight:bold;letter-spacing:.02em;color:#334155}
#topBar .tb-badge{background:#0F766E;color:#fff;font-size:13px;padding:2px 10px;border-radius:999px;font-weight:normal}
#topBar .tb-links{display:flex;align-items:center;gap:8px;font-size:13px}
#topBar .tb-links a{text-decoration:none;padding:5px 12px;border-radius:999px;font-weight:bold;transition:transform .15s}
#topBar .tb-links a:hover{transform:translateY(-1px)}
#topBar .btn-hub{background:#f1f5f9;color:#0f172a;border:1px solid #cbd5e1}
#topBar .btn-pptx{background:#14B8A6;color:#042f2e}
#topBar .btn-vid{background:#FFE4E6;color:#9F1239;border:1px solid #FECDD3}

#stageWrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:10px}
#stage{position:relative;width:100%;max-width:calc((100vh - 118px)*16/9);aspect-ratio:16/9;overflow:hidden;background:var(--bg);border-radius:12px;box-shadow:0 12px 44px #0009}
.layer{position:absolute;inset:0;overflow:hidden}
.layer>.scaler{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.mask{position:absolute;pointer-events:none;display:none;z-index:20}

/* 下方特效與導播控制列 */
#bar{height:54px;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:15px;background:#141625;border-top:1px solid #2b2f48;flex:none}
#bar button,#bar select{background:#2b2f48;color:#e8ecf6;border:1px solid #444a6e;border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
#bar button:hover,#bar select:hover{border-color:#7DB7F0}
#bar button.on{background:var(--teal);border-color:var(--teal);color:#062b27;font-weight:bold}
#prog{flex:1;position:relative;height:10px;background:#2b2f48;border-radius:6px;cursor:pointer}
#progFill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--teal),var(--violet));border-radius:6px}
.cm{position:absolute;top:-4px;width:3px;height:18px;background:#e8ecf6aa;border-radius:2px}
#count{min-width:68px;text-align:center;font-family:var(--n);font-size:14px}
#toast{position:fixed;left:16px;bottom:66px;font-size:14px;color:#e8ecf6;background:#000b;padding:6px 14px;border-radius:999px;opacity:0;transition:opacity .4s;pointer-events:none;z-index:70}
#notes{position:fixed;right:14px;bottom:66px;width:min(500px,92vw);max-height:48vh;overflow:auto;background:#fffdf6;color:#2B2D42;border-radius:14px;padding:16px 18px;font-size:17px;line-height:1.65;display:none;box-shadow:0 10px 36px #0009;border:3px solid var(--teal);z-index:50}
#notes b{color:#0F766E;font-size:18px}
#ov{position:fixed;inset:0;background:#141625f5;overflow:auto;display:none;z-index:60;padding:22px 26px}
#ov .gt{font-family:var(--h);font-size:28px;margin:4px 0 12px;color:#fff;display:flex;justify-content:space-between;align-items:center}
#ov .ph{font-family:var(--h);font-size:20px;margin:18px 0 8px;padding-left:10px;border-left:6px solid var(--k);color:#fff}
#ov .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
#ov figure{margin:0;cursor:pointer;transition:transform .15s}
#ov figure:hover{transform:translateY(-3px)}
#ov figure .th{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:8px;background:var(--bg);outline:3px solid transparent}
#ov figure.cur .th{outline-color:var(--amber)}
#ov figure .th>div{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;pointer-events:none}
#ov figure>figcaption{font-size:14px;margin-top:5px;color:#cfd3e6}
@media(max-width:700px){#topBar .tb-links{display:none}#bar{font-size:12px;gap:4px;padding:0 6px}#bar button,#bar select{padding:4px 6px}#trSel{max-width:95px}}

/* ===== 投影片 1920x1080 大字視覺系統 ===== */
.sl section{position:relative;width:1920px;height:1080px;box-sizing:border-box;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--b);display:flex;flex-direction:column;justify-content:center;padding:122px 104px 72px}
.sl section.nopad{padding:86px 110px}
.sl h1,.sl h2,.sl h3,.sl p,.sl ul,.sl ol{margin:0}
.sl ul,.sl ol{padding-left:1.15em}
.sl table{border-collapse:collapse;color:inherit;font-family:inherit;text-align:left}
.sl *{box-sizing:border-box}
.sl .tag{position:absolute;left:56px;top:22px;font:bold 28px var(--h);color:var(--teal2);background:var(--card-bg,#fff);border:3px solid var(--teal);padding:3px 18px;border-radius:999px;z-index:5}
.sl .pg{position:absolute;right:52px;bottom:28px;font:bold 30px var(--n);color:var(--ink);opacity:.6;z-index:5}
.sl .sign{position:absolute;left:56px;bottom:30px;font:bold 26px var(--b);color:#1E293B;z-index:5;background:#ffffffdd;padding:4px 16px;border-radius:999px}
.sl section.dark .sign{background:#0F172Acc;color:#ffffffcc}
.sl .h{font:bold 110px/1.15 var(--h);letter-spacing:.01em}
.sl .h small{display:block;font-size:38px;color:var(--teal2);margin-bottom:6px;font-weight:bold}
.sl .sub{font:bold 46px/1.45 var(--b);color:var(--ink);opacity:.85;margin-top:16px}
.sl .bl{font:bold 50px/1.55 var(--b);margin-top:28px}
.sl .bl li{margin:14px 0}
.sl .bl li::marker{color:var(--k,var(--teal));font-family:var(--n)}
.sl .bl b{color:var(--teal2);font-family:var(--h);font-weight:bold}
.sl .row{display:flex;gap:48px;align-items:center}
.sl .grow{flex:1;min-width:0}
.sl .bub{position:absolute;background:var(--card-bg,#fff);color:var(--ink);border:4px solid var(--ink);border-radius:28px;padding:14px 24px;font:bold 40px/1.35 var(--h);white-space:nowrap;box-shadow:6px 6px 0 #2B2D4222;z-index:10}
.sl .bub::after{content:"";position:absolute;width:26px;height:26px;background:var(--card-bg,#fff);border:4px solid var(--ink);border-top:0;border-left:0;transform:rotate(45deg);bottom:-17px;left:50%}
.sl .ch-reelo{background:var(--reelo) center bottom/contain no-repeat}
.sl .ch-wavi{background:var(--wavi) center bottom/contain no-repeat}
.sl .who{width:400px;aspect-ratio:4/5;flex:none}
.sl .card{background:var(--card-bg,#fff);border-radius:34px;padding:28px 30px;box-shadow:0 10px 0 var(--k,var(--teal)),0 16px 40px #2B2D4214;border:4px solid var(--k,var(--teal))}
.sl .card .ic{font-size:84px;line-height:1}
.sl .card h3{font:bold 50px/1.25 var(--h);margin:12px 0 8px;color:var(--ink)}
.sl .card p{font:bold 38px/1.45 var(--b);color:var(--ink);opacity:.9}
.sl .card p b{color:var(--teal2);font-family:var(--h);font-weight:bold}
.sl .cards{display:grid;gap:32px;margin-top:32px}

/* 專屬元件：編號步驟 */
.sl .steps{margin-top:34px;display:grid;gap:22px}
.sl .step{display:flex;align-items:center;gap:30px;font:bold 50px/1.35 var(--b);background:var(--card-bg,#fff);padding:18px 28px;border-radius:28px;border:4px solid var(--ink);box-shadow:0 8px 0 #2B2D4218}
.sl .step .no{flex:none;width:86px;height:86px;border-radius:50%;background:var(--k,var(--teal));color:#fff;font:bold 48px/76px var(--n);text-align:center;border:5px solid #2B2D42}
.sl .step b{font-family:var(--h);font-weight:bold;color:var(--teal2)}

/* 專屬元件：指令列 */
.sl .cmd{margin-top:36px;background:#1F2338;border-radius:30px;padding:32px 42px;color:#E8ECF6;font:bold 48px/1.5 var(--b);border:5px solid #2B2D42;box-shadow:0 14px 0 var(--violet)}
.sl .cmd .ln{display:flex;align-items:center;gap:22px;padding:14px 0;border-bottom:2px dashed #ffffff22}
.sl .cmd .ln:last-child{border-bottom:0}
.sl .cmd .sl-k{font:bold 40px var(--n);color:var(--teal);background:#14B8A622;border-radius:14px;padding:6px 20px;white-space:nowrap}
.sl .cmd .ar{color:var(--amber);font-family:var(--n);font-weight:bold}
.sl .cmd b{color:#38BDF8;font-family:var(--h);font-weight:bold}

/* 專屬元件：存錢筒用量儀表 */
.sl .meter{display:flex;gap:44px;align-items:stretch;margin-top:40px}
.sl .big{font:bold 200px/1 var(--n);color:var(--teal)}
.sl .gauge{flex:1;background:var(--card-bg,#fff);border:5px solid var(--ink);border-radius:36px;padding:34px 42px;display:grid;gap:24px}
.sl .gbar{height:44px;border-radius:22px;background:#E5E7F0;overflow:hidden;border:4px solid var(--ink)}
.sl .gbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--amber))}
.sl .glab{font:bold 46px/1.3 var(--b);display:flex;justify-content:space-between}

/* 專屬元件：雙欄比較 */
.sl .cmp{display:grid;grid-template-columns:1fr 1fr;gap:42px;margin-top:28px}
.sl .cmp .col{border-radius:34px;padding:32px 38px;border:5px solid var(--ink);box-shadow:0 12px 0 #1E293B20}
.sl .cmp h3{font:bold 50px/1.2 var(--h);margin-bottom:12px}
.sl .cmp ul{font:bold 42px/1.55 var(--b)}
.sl .cmp b{color:var(--teal2);font-family:var(--h);font-weight:bold}

/* 專屬元件：水平時間軸 */
.sl .tl{display:flex;gap:34px;margin-top:50px;position:relative}
.sl .tl::before{content:"";position:absolute;left:0;right:0;top:46px;height:10px;background:var(--ink);border-radius:5px}
.sl .tl .pt{flex:1;position:relative;background:var(--card-bg,#fff);border:4px solid var(--ink);border-radius:28px;padding:96px 28px 28px;box-shadow:0 10px 0 var(--k)}
.sl .tl .pt::before{content:"";position:absolute;left:32px;top:18px;width:58px;height:58px;border-radius:50%;background:var(--k);border:6px solid var(--ink)}
.sl .tl .dt{font:bold 44px var(--n);color:var(--k)}
.sl .tl p{font:bold 44px/1.45 var(--b);margin-top:10px}
.sl .tl p b{font-family:var(--h);font-weight:bold;color:var(--ink)}

/* 專屬元件：FAQ 問答卡 */
.sl .faq{display:grid;grid-template-columns:1fr 1fr;gap:26px 36px;margin-top:34px}
.sl .faq .q{font:bold 46px/1.3 var(--h);background:var(--lilac);border-radius:26px 26px 26px 6px;padding:18px 24px;border:4px solid var(--violet)}
.sl .faq .a{font:bold 42px/1.4 var(--b);padding:12px 20px 0}
.sl .faq .a b{color:var(--teal2);font-family:var(--h);font-weight:bold}

/* 專屬元件：打勾清單 */
.sl .ck{list-style:none;padding:0;font:bold 50px/1.5 var(--b);margin-top:30px}
.sl .ck li{display:flex;gap:22px;align-items:center;margin:18px 0}
.sl .ck li::before{content:"✓";flex:none;width:64px;height:64px;border-radius:16px;border:5px solid var(--ink);background:var(--mint);color:var(--teal2);font:bold 42px/56px var(--n);text-align:center}
.sl .ck b{color:var(--teal2);font-family:var(--h);font-weight:bold}

/* 專屬元件：深色章節頁與場記板 */
.sl section.dark{background:var(--dark-grad,radial-gradient(circle at 70% 30%,#2E3A7A,#141833));color:#F5F1E8}
.sl section.dark .h{color:#fff}
.sl section.dark .h small{color:var(--mint)}
.sl section.dark .tag{background:#0F172A;color:var(--mint)}
.sl section.dark .pg{color:#ffffffaa}
.sl .poster{position:absolute;inset:0;background:var(--poster) center/cover no-repeat}
.sl .glass{background:#ffffffeb;color:#1E293B;backdrop-filter:blur(12px);border-radius:44px;padding:50px 58px;border:5px solid #fff;box-shadow:0 24px 64px #1E293B38;width:1080px}
.sl .pill{display:inline-block;font:bold 30px var(--h);padding:6px 20px;border-radius:999px;background:var(--k,var(--teal));color:#fff;margin:0 8px 10px 0}
.sl .three{display:grid;gap:26px;margin-top:36px}
.sl .three div{font:bold 52px/1.3 var(--h);padding:22px 34px;border-radius:28px;background:linear-gradient(90deg,#ffffff1c,#ffffff08);border-left:16px solid var(--k);color:#fff}
.sl .vis{flex:none;border-radius:46px;border:5px solid var(--ink);position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;font:bold 44px/1.35 var(--h);text-align:center;padding:26px;box-shadow:0 14px 0 var(--teal);color:#1E293B}
.sl .vis .em{font-size:130px;line-height:1}

.sl .clapb{width:620px;margin-bottom:34px}
.sl .clapt{height:70px;background:repeating-linear-gradient(120deg,#F5F7FA 0 40px,#0F172A 40px 80px);border:6px solid #F5F7FA;border-radius:10px 10px 0 0;transform:rotate(-8deg);transform-origin:0 100%}
.sl .clapbody{background:#0F172A;border:6px solid #F5F7FA;border-top:0;padding:18px 26px;display:flex;justify-content:space-between;align-items:center;font:bold 34px var(--n);color:#CBD5E1}
.sl .clapbody b{font:bold 104px/1 var(--n);color:var(--k,var(--teal))}

/* 專屬元件：巨型流程管線圖 */
.sl .pipe{display:flex;align-items:center;gap:18px;margin-top:48px}
.sl .pipe div{flex:1;background:var(--card-bg,#fff);border:5px solid var(--k);border-radius:30px;padding:34px 16px;text-align:center;font-size:80px;box-shadow:0 12px 0 var(--k)}
.sl .pipe b{display:block;font:bold 46px/1.3 var(--h);margin-top:12px;color:var(--ink)}
.sl .pipe span{font:bold 64px var(--n);color:var(--ink)}

/* 專屬圖面元件 1：真實系統截圖瀏覽器視窗 (.sgrid / .sframe) */
.sl .sgrid{display:grid;grid-template-columns:1fr 1fr;gap:36px;margin-top:22px}
.sl .sframe{background:#0F172A;border:5px solid var(--ink);border-radius:28px;overflow:hidden;box-shadow:0 12px 0 var(--k,var(--teal));display:flex;flex-direction:column}
.sl .sbar{background:#1E293B;padding:10px 18px;display:flex;align-items:center;gap:10px;border-bottom:3px solid #334155}
.sl .sbar i{width:15px;height:15px;flex:none;border-radius:50%;background:#EF4444;display:inline-block}
.sl .sbar i:nth-child(2){background:#F59E0B}
.sl .sbar i:nth-child(3){background:#10B981}
.sl .sbar span{font:bold 24px var(--h);color:#E2E8F0;margin-left:6px;white-space:nowrap}
.sl .simg{height:390px;background-size:cover;background-position:center;background-repeat:no-repeat}
.sl .scap{background:var(--card-bg,#fff);color:var(--ink);padding:14px 18px;font:bold 31px/1.3 var(--b);border-top:4px solid var(--ink);white-space:nowrap}
.sl .scap b{color:var(--teal2);font-family:var(--h);font-weight:bold}

/* 專屬圖面元件 2：擬真 Google 試算表一鍵建立副本 UI (.gsheet) */
.sl .gsheet{width:840px;flex:none;background:#fff;border:5px solid var(--ink);border-radius:28px;overflow:hidden;box-shadow:0 14px 0 var(--teal);position:relative}
.sl .gs-top{background:#107C41;color:#fff;font:bold 32px var(--h);padding:14px 22px;display:flex;align-items:center;gap:12px}
.sl .gs-menu{background:#F1F5F9;padding:10px 22px;display:flex;gap:22px;font:bold 28px var(--h);color:#334155;border-bottom:3px solid #CBD5E1;position:relative;align-items:center}
.sl .gs-menu span{white-space:nowrap}
.sl .gs-menu span:first-child{background:#14B8A6;color:#fff;padding:3px 14px;border-radius:8px}
.sl .gs-drop{position:absolute;left:18px;top:52px;background:#fff;border:4px solid var(--ink);border-radius:18px;box-shadow:0 12px 30px #0004;padding:8px 10px;z-index:10;width:500px}
.sl .gs-drop div{padding:8px 14px;font:bold 28px var(--h);color:#475569;border-radius:10px;white-space:nowrap}
.sl .gs-drop div.active{background:#FEF3C7;color:#B45309;border:3px solid #F59E0B;font-weight:bold}
.sl .gs-grid{width:100%;font:bold 28px var(--b);margin-top:180px}
.sl .gs-grid th{background:#E2E8F0;color:#1E293B;font:bold 28px var(--h);padding:10px 16px;border:2px solid #CBD5E1;white-space:nowrap}
.sl .gs-grid td{padding:12px 16px;border:2px solid #CBD5E1;color:#334155;white-space:nowrap}
.sl .gs-grid td.edit{background:#ECFDF5;color:#0F766E;font-family:var(--h);border:3px solid #14B8A6}

/* 專屬元件 3：可點擊網址膠囊與五大網站總表 (.lnk / .stbl) */
.sl a.lnk{color:var(--teal2);text-decoration:underline;text-underline-offset:4px;font-weight:bold}
.sl a.lnk:hover{color:var(--orange)}
.sl a.lnk-dark{color:#38BDF8;text-decoration:underline;text-underline-offset:4px;font-weight:bold}
.sl .stbl{width:100%;margin-top:26px;background:var(--card-bg,#fff);border:5px solid var(--ink);border-radius:26px;overflow:hidden;box-shadow:0 12px 0 var(--teal);font:bold 29px/1.35 var(--b)}
.sl .stbl th{background:#0F172A;color:#fff;padding:12px 16px;font:bold 28px var(--h);border-bottom:4px solid var(--ink);white-space:nowrap}
.sl .stbl td{padding:10px 16px;border-bottom:3px solid #CBD5E1;vertical-align:middle}
.sl .stbl tr:last-child td{border-bottom:0}
.sl .stbl td small{font-size:22px;color:var(--teal2);display:block;margin-top:2px}

/* 過場遮罩動畫樣式 */
#mClap{inset:0}
#mClap .ct,#mClap .cb{position:absolute;left:-5%;width:110%;height:58%;background:repeating-linear-gradient(120deg,#1E293B 0 7%,#F5F7FA 7% 14%);border:1vw solid #1E293B;box-sizing:border-box}
#mClap .ct{top:0;transform-origin:4% 100%}#mClap .cb{bottom:0;background:#1E293B;display:flex;align-items:center;justify-content:center}

<script>
const zzfxG=(R,volume=1,randomness=0,frequency=220,attack=0,sustain=0,release=.1,shape=0,shapeCurve=1,slide=0,deltaSlide=0,pitchJump=0,pitchJumpTime=0,repeatTime=0,noise=0,modulation=0,bitCrush=0,delay=0,sustainVolume=1,decay=0,tremolo=0,filter=0)=>{
  const PI2=Math.PI*2,abs=Math.abs,sign=v=>v<0?-1:1;
  let startSlide=slide*=500*PI2/R/R,
  startFrequency=frequency*=(1+randomness*2*Math.random()-randomness)*PI2/R,
  b=[],t=0,tm=0,i=0,j=1,r=0,c=0,s=0,f,length,
  quality=2,w=PI2*abs(filter)*2/R,cos=Math.cos(w),alpha=Math.sin(w)/2/quality,
  a0=1+alpha,a1=-2*cos/a0,a2=(1-alpha)/a0,b0=(1+sign(filter)*cos)/2/a0,b1=-(sign(filter)+cos)/a0,b2=b0,x2=0,x1=0,y2=0,y1=0;
  attack=attack*R+9;decay*=R;sustain*=R;release*=R;delay*=R;
  deltaSlide*=500*PI2/R**3;modulation*=PI2/R;pitchJump*=PI2/R;pitchJumpTime*=R;repeatTime=repeatTime*R|0;volume*=.3;
  for(length=attack+decay+sustain+release+delay|0;i<length;b[i++]=s*volume){
    if(!(++c%(bitCrush*100|0))){
      s=shape?shape>1?shape>2?shape>3?Math.sin(t**3):Math.max(Math.min(Math.tan(t),1),-1):1-(2*t/PI2%2+2)%2:1-4*abs(Math.round(t/PI2)-t/PI2):Math.sin(t);
      s=(repeatTime?1-tremolo+tremolo*Math.sin(PI2*i/repeatTime):1)*sign(s)*abs(s)**shapeCurve*
        (i<attack?i/attack:i<attack+decay?1-((i-attack)/decay)*(1-sustainVolume):i<attack+decay+sustain?sustainVolume:i<length-delay?(length-i-delay)/release*sustainVolume:0);
      s=delay?s/2+(delay>i?0:(i<length-delay?1:(length-i)/delay)*b[i-delay|0]/2/volume):s;
      if(filter)s=y1=b2*x2+b1*(x2=x1)+b0*(x1=s)-a2*y2-a1*(y2=y1);
    }
    f=(frequency+=slide+=deltaSlide)*Math.cos(modulation*tm++);
    t+=f+f*noise*Math.sin(i**5);
    if(j&&++j>pitchJumpTime){frequency+=pitchJump;startFrequency+=pitchJump;j=0}
    if(repeatTime&&!(++r%repeatTime)){frequency=startFrequency;slide=startSlide;j=j||1}
  }
  return b;
};
const zzfxMRender=(song,R=44100)=>{
  const [ins,pats,seq,bpm]=song,step=60/bpm/2*R|0,cache={};
  let total=0;seq.forEach(p=>{total+=pats[p][0].length-2});
  const L=new Float32Array(total*step+R*2),Rt=new Float32Array(total*step+R*2);
  let pos=0;
  seq.forEach(p=>{
    const pat=pats[p];
    pat.forEach(ch=>{
      const [ii,pan]=ch;
      for(let k=2;k<ch.length;k++){
        const v=ch[k];if(!v)continue;
        const n=Math.floor(v),vel=(v-n)||1,key=ii+'_'+n;
        let smp=cache[key];
        if(!smp){const l=[...ins[ii]];l[2]*=2**((n-12)/12);smp=cache[key]=zzfxG(R,...l)}
        const o=pos+(k-2)*step,gl=vel*(1-pan)/2+vel*.25,gr=vel*(1+pan)/2+vel*.25;
        for(let q=0;q<smp.length&&o+q<L.length;q++){L[o+q]+=smp[q]*gl;Rt[o+q]+=smp[q]*gr}
      }
    });
    pos+=(pat[0].length-2)*step;
  });
  const len=pos;
  for(let q=len;q<L.length;q++){L[q-len]+=L[q];Rt[q-len]+=Rt[q]}
  return [L.subarray(0,len),Rt.subarray(0,len)];
};

\"tag\">二、深度打磨四大系統</div><div class=\"pg\">7</div></section>"}, {"id": 8, "title": "網站 3 討論打磨亮點：魔鬼細節全克服", "layout": "雙欄演進圖（行事曆討論過程）", "notes": "【1:48-2:02 行事曆討論過程亮點】這套行事曆在討論過程中解決了許多實戰魔鬼細節：例如我們發現舊資料沒有勾選參與單位，就寫程式自動從備註欄抓出「參加人員」納入防衝堂；發現未登入前不能外洩試算表，就加上管理密碼保護與 4 分頁異動紀錄稽核；甚至連瀏覽器自動填入密碼害搜尋框把行事曆濾掉的怪問題，我們都徹底修好並寫進 Skill 範本裡！", "html": "<section style=\"--k:#14B8A6\"><h1 class=\"h\" style=\"font-size:86px\"><small>《校園智慧行事曆》反覆討論修正的實戰亮點</small>從「能排程」打磨到「零漏接、高資安」</h1><div class=\"cmp\"><div class=\"col\" style=\"background:var(--mint)\"><h3>🔍 討論發現的校園盲點</h3><ul><li><b>人員分身乏術</b>：借不同場地卻同時找九年級導師開會</li><li><b>歷史資料斷層</b>：早期會議沒填參與單位，導致漏判衝堂</li><li><b>資安與瀏覽器怪癖</b>：試算表怕外洩、密碼誤填進搜尋框</li></ul></div><div class=\"col\" style=\"background:var(--lilac)\"><h3>✨ 討論後升級的亮點解方</h3><ul><li><b>場地＋人員雙防撞</b>：自動回溯擷取舊備註名單零漏判</li><li><b>AI 排程秘書對話</b>：自然語言問空檔並<b>一鍵帶入預約</b></li><li><b>試算表 4 分頁稽核</b>：密碼解鎖才露網址＋<b>異動全留存</b></li></ul></div></div><div class=\"tag\">二、深度打磨四大系統</div><div class=\"pg\">8</div></section>"}, {"id": 9, "title": "網站 4：學習能量軌跡 AI 助教（兩站合一！）", "layout": "雙畫面圖解＋網址與 Skill", "notes": "【2:02-2:18 網站 4：學習能量軌跡 AI 助教】第四個網站是《學習能量軌跡 AI 助教》！這更是我們花了大量心力重新討論架構的代表作——我們把原本分開的「自主學習助教」跟「藝術能量掃描儀」兩個網站功能徹底整合在一起！同一個網站既能交五科探究筆記（左圖），又能評畫作美感、做 58mm 實體創客胸章與 A4 六宮格刀模（右圖），並封裝成專屬 Skill 讓外校裝 1 套抵 2 套！", "html": "<section style=\"--k:#F59E0B\"><h1 class=\"h\" style=\"font-size:61px\"><small style=\"font-size:25px\">網站 04｜🌐 <a class=\"lnk\" href=\"https://coolokey.github.io/learning-energy-tracker/\" target=\"_blank\">coolokey.github.io/learning-energy-tracker/</a> ｜ 🛠️ Skill：<a class=\"lnk\" href=\"https://github.com/coolokey/ai-learning-energy-tracker-skill\" target=\"_blank\">github.com/coolokey/ai-learning-energy-tracker-skill</a></small>學習能量軌跡 AI 助教（把兩個網站功能整合在一起！）</h1><div class=\"sgrid\"><div class=\"sframe\" style=\"--k:var(--teal)\"><div class=\"sbar\"><i></i><i></i><i></i><span>討論亮點 A｜兩站合一：五科探究筆記 × 畫作美感同站收件</span></div><div class=\"simg\" style=\"background-image:var(--img-study);background-position:top center\"></div><div class=\"scap\">📈 免登入隨拍即評 ➔ <b>訂正重交躍升折線（+18分激勵）</b></div></div><div class=\"sframe\" style=\"--k:var(--orange)\"><div class=\"sbar\"><i></i><i></i><i></i><span>討論亮點 B｜58mm 實體胸章三規刀模 × A4 六宮格印刷單</span></div><div class=\"simg\" style=\"background-image:var(--img-badge);background-position:top center\"></div><div class=\"scap\">🏅 防切字雙層留白 ➔ <b>直接印出 A4 六宮格胸章與證書</b></div></div></div><div class=\"tag\">二、深度打磨四大系統</div><div class=\"pg\">9</div></section>"}, {"id": 10, "title": "網站 4 討論打磨亮點：教師手冊與破格核章", "layout": "雙畫面圖解（手冊與後台）", "notes": "【2:18-2:32 學習能量軌跡討論亮點】在討論《學習能量軌跡》時，我們思考：「怎樣才能讓外校老師不用研習也會用？怎樣照顧低成就但很努力的孩子？」因此我們在首頁直接做好 1~6 章完整單排並陳的《教師使用手冊》（左圖）；並在教師後台加入「全班五維診斷雷達」與「導師一鍵破格批次核發胸章」（右圖），就算學生沒考到 85 分，只要態度用心，老師勾選就能破格頒發胸章送上 3D 星空藝廊，期末還能 10 秒匯出 Google Docs 成果冊！", "html": "<section style=\"--k:#F59E0B\"><h1 class=\"h\" style=\"font-size:80px\"><small>《學習能量軌跡》討論打磨亮點：照顧每位孩子與外校老師</small>首頁 1~6 章教師手冊 × 導師破格批次核章</h1><div class=\"sgrid\"><div class=\"sframe\" style=\"--k:var(--teal)\"><div class=\"sbar\"><i></i><i></i><i></i><span>討論亮點 C｜首頁內建 1~6 章單排並陳《教師使用手冊》</span></div><div class=\"simg\" style=\"background-image:var(--img-tracker-man);background-position:top center\"></div><div class=\"scap\">📖 6 欄響應式單排標籤 ➔ <b>外校老師免研習看圖秒懂</b></div></div><div class=\"sframe\" style=\"--k:var(--violet)\"><div class=\"sbar\"><i></i><i></i><i></i><span>討論亮點 D｜全班五維診斷雷達 × 導師破格核章 × 成果冊</span></div><div class=\"simg\" style=\"background-image:var(--img-tracker-adm);background-position:top center\"></div><div class=\"scap\">❤️ 未達 85 分也能破格核章 ➔ <b>10 秒產出 Docs 成果冊</b></div></div></div><div class=\"tag\">二、深度打磨四大系統</div><div class=\"pg\">10</div></section>"}, {"id": 11, "title": "網站 5：歷屆段考成績查詢與學習診斷系統", "layout": "雙畫面圖解＋網址與 Skill", "notes": "【2:32-2:52 網站 5：段考成績查詢系統】第五個網站是《國中歷屆段考成績查詢與學習診斷系統》！因為長期都有家長或學生索取班排或校排，鄰近學校有經費可以購買商用成績系統，但本校沒有多餘經費，於是我們決定零成本自行開發！開發過程中我們特別要求 AI Agent 嚴格遵守教育部規定——所有排名一律以「序位區間（如班排 1~5名、年排 1~20名）」與五等第呈現（左圖），更支援導師一鍵列印一人一張含五標定位條與家長簽章回條的 A4 個人成績通知單（右圖）！", "html": "<section style=\"--k:#0EA5E9\"><h1 class=\"h\" style=\"font-size:61px\"><small style=\"font-size:25px\">網站 05｜🌐 <a class=\"lnk\" href=\"https://coolokey.github.io/dsjh-score/\" target=\"_blank\">coolokey.github.io/dsjh-score/</a> ｜ 🛠️ Skill：<a class=\"lnk\" href=\"https://github.com/coolokey/school-exam-score-system-skill\" target=\"_blank\">github.com/coolokey/school-exam-score-system-skill</a></small>歷屆段考成績查詢系統（零經費自建 × 嚴遵教育部區間排名）</h1><div class=\"sgrid\"><div class=\"sframe\" style=\"--k:var(--teal)\"><div class=\"sbar\"><i></i><i></i><i></i><span>討論亮點 A｜無經費自建 × 嚴遵教育部「序位區間（1~5名/1~20名）」</span></div><div class=\"simg\" style=\"background-image:var(--img-score-stu);background-position:top center\"></div><div class=\"scap\">🏛️ 拒絕公布個別名次 ➔ <b>區間落點＋五標彩條＋雷達圖</b></div></div><div class=\"sframe\" style=\"--k:var(--amber)\"><div class=\"sbar\"><i></i><i></i><i></i><span>討論亮點 B｜一人一頁 A4 個人成績通知單（單生／全班批次列印）</span></div><div class=\"simg\" style=\"background-image:var(--img-score-rep);background-position:top center\"></div><div class=\"scap\">🖨️ 自動排版五標定位與評語 ➔ <b>附家長簽章回條撕線</b></div></div></div><div class=\"tag\">二、深度打磨四大系統</div><div class=\"pg\">11</div></section>"}, {"id": 12, "title": "網站 5 討論打磨亮點：雙軌校排、區間分析與高資安", "layout": "雙畫面＋重點清單（成績系統討論亮點）", "notes": "【2:52-3:10 段考成績系統討論亮點】在開發這套成績系統的過程中，我們更克服了四大教務難題：第一，移除具名扶助清單，改為不具名的「各科 11 分數區間長條圖與總表」落實去標籤化；第二，精準實作「普通班與體育班雙軌校排分流」、九年級自然 3:2:1 加權、以及「學習中心免測空白格絕不誤判為 0 分」；第三，支援 Excel 式左側凍結窗格與入學至九年級跨學年度歷屆追蹤大榜；第四，採用 1000 輪加鹽 SHA-256 加密，而且這套系統的師生名冊更直接成為下一套《社團選社系統》的共用帳號母體！", "html": "<section style=\"--k:#0EA5E9\"><div class=\"row\" style=\"gap:38px\"><div style=\"width:760px;flex:none\"><h1 class=\"h\" style=\"font-size:66px\"><small style=\"font-size:34px\">《歷屆段考成績系統》反覆校對打磨的教務真功夫</small>雙軌校排 × 11 區間分析<br>× 跨系統共用名冊母體</h1><ul class=\"ck\" style=\"font-size:35px;margin-top:16px\"><li><span>📊 <b>去標籤化區間分析</b>：移除具名扶助清單，改為<b>各科 11 區間長條圖</b></span></li><li><span>⚖️ <b>雙軌校排＋免測防呆</b>：普通/體育班母體分流、<b>學中免測空白不計 0 分</b></span></li><li><span>📌 <b>凍結窗格＋歷屆大榜</b>：左右滑動釘選姓名、一鍵查<b>入學至今歷屆校排</b></span></li><li><span>🔐 <b>高資安＋選社母體</b>：千輪加鹽雜湊、強制改密，<b>直接供選社系統共用</b></span></li></ul></div><div class=\"sframe\" style=\"flex:1;--k:var(--teal)\"><div class=\"sbar\"><i></i><i></i><i></i><span>討論亮點 C｜各科 11 區間人數總表 × Excel 式凍結窗格全班名冊</span></div><div class=\"simg\" style=\"height:460px;background-image:var(--img-score-ana);background-position:top center\"></div><div class=\"scap\">📐 Q2 中位數六大常模指標 ➔ <b>全校 30 班 688 人實戰驗證！</b></div></div></div><div class=\"tag\">二、深度打磨四大系統</div><div class=\"pg\">12</div></section>"}, {"id": 13, "title": "網站 6：AI 智慧社團選社系統（分享與實機）", "layout": "雙畫面圖解＋網址與 Skill", "notes": "【3:10-3:26 網站 6：AI 智慧社團選社系統】第六個網站就是緊接著串連的《AI 智慧社團選社系統》！在跟訓育組與導師深入討論後，我們打造了許多貼心設計：左圖支援「社團分年級開放限制（限7、8、9年級防呆）」與「本班防抱團人數上限」，而且當 28 個社團卡片很長時，底部有「吸底確認送出列」不用滑到底；右圖則是導師最愛的「班級追蹤專區」，點一下就能複製未選名單貼到家長 LINE 群催繳！", "html": "<section style=\"--k:#8B7CF6\"><h1 class=\"h\" style=\"font-size:66px\"><small style=\"font-size:28px\">網站 06｜🌐 <a class=\"lnk\" href=\"https://coolokey.github.io/dsjh-ai-club-selector/\" target=\"_blank\">coolokey.github.io/dsjh-ai-club-selector/</a> ｜ 🛠️ Skill：<a class=\"lnk\" href=\"https://github.com/coolokey/ai-club-selector-skill\" target=\"_blank\">github.com/coolokey/ai-club-selector-skill</a></small>AI 智慧社團選社系統（分年級防抱團 × 導師一鍵催繳）</h1><div class=\"sgrid\"><div class=\"sframe\" style=\"--k:var(--teal)\"><div class=\"sbar\"><i></i><i></i><i></i><span>討論亮點 A｜分年級開放防呆 × 本班防抱團 × 吸底送出列</span></div><div class=\"simg\" style=\"background-image:var(--img-club);background-position:top center\"></div><div class=\"scap\">🎯 26 個探索標籤＋吸底確認列 ➔ <b>選社免滑到底部！</b></div></div><div class=\"sframe\" style=\"--k:var(--amber)\"><div class=\"sbar\"><i></i><i></i><i></i><span>討論亮點 B｜導師班級追蹤專區 × 一鍵複製 LINE 催繳文案</span></div><div class=\"simg\" style=\"background-image:var(--img-club-hr);background-position:top center\"></div><div class=\"scap\">📋 紅綠標示未選名單 ➔ <b>1 秒複製貼上家長 LINE 群</b></div></div></div><div class=\"tag\">二、深度打磨四大系統</div><div class=\"pg\">13</div></section>"}, {"id": 14, "title": "網站 6 討論打磨亮點 成 AI Skill！", "layout": "指令列步驟＋吉祥物（專屬）", "notes": "【3:50-4:10 AI Skill 一鍵複製】過去外校複製系統還要手動改程式碼，現在我們把「行事曆、學習能量軌跡、歷屆段考成績查詢、社團選社」四大系統全部封裝成 GitHub 開源的 Antigravity AI Skill！每個 Skill 裡面都內建 scaffold.ps1 自動化腳本與資安單元測試。外校老師只要載入我們的 Skill 網址，輸入學校名稱與試算表 ID，1 分鐘就能自動替換全站校名、完成雙重驗證並直接發布上線！", "html": "<section style=\"--k:#8B7CF6\"><div class=\"row\"><div class=\"grow\"><h1 class=\"h\" style=\"font-size:84px\"><small>首創將四大校園系統封裝為開源 Antigravity AI Skill</small>外校載入 Skill ➔ 1 分鐘自動換校名上線</h1><div class=\"cmd\" style=\"margin-top:18px;padding:24px 34px;font-size:36px\"><div class=\"ln\" style=\"padding:10px 0\"><span class=\"sl-k\">SKILL 1</span><span class=\"ar\">➔</span><span><b>校園行事曆</b>：<a class=\"lnk-dark\" href=\"https://github.com/coolokey/ai-school-calendar-skill\" target=\"_blank\">github.com/coolokey/ai-school-calendar-skill</a></span></div><div class=\"ln\" style=\"padding:10px 0\"><span class=\"sl-k\">SKILL 2</span><span class=\"ar\">➔</span><span><b>學習能量軌跡</b>：<a class=\"lnk-dark\" href=\"https://github.com/coolokey/ai-learning-energy-tracker-skill\" target=\"_blank\">github.com/coolokey/ai-learning-energy-tracker-skill</a></span></div><div class=\"ln\" style=\"padding:10px 0\"><span class=\"sl-k\">SKILL 3</span><span class=\"ar\">➔</span><span><b>段考成績系統</b>：<a class=\"lnk-dark\" href=\"https://github.com/coolokey/school-exam-score-system-skill\" target=\"_blank\">github.com/coolokey/school-exam-score-system-skill</a></span></div><div class=\"ln\" style=\"padding:10px 0\"><span class=\"sl-k\">SKILL 4</span><span class=\"ar\">➔</span><span><b>社團選社系統</b>：<a class=\"lnk-dark\" href=\"https://github.com/coolokey/ai-club-selector-skill\" target=\"_blank\">github.com/coolokey/ai-club-selector-skill</a></span></div></div><p class=\"sub\" style=\"font-size:38px;margin-top:14px\">⚡ 均附 <b>scaffold.ps1</b> 一鍵腳本：自動替換校名、綁定試算表、跑完<b>逾 90 項資安與邏輯測試</b>！</p></div><div class=\"who ch-reelo\" style=\"position:relative;width:290px\"><div class=\"bub\" style=\"top:-96px;left:0px\">講一句話就建好！</div></div></div><div class=\"tag\">三、跨校複製與 Skill</div><div class=\"pg\">16</div></section>"}, {"id": 17, "title": "會用試算表，就會管四大系統後台", "layout": "擬真 Google 試算表 UI 圖解（專屬）", "notes": "【4:10-4:25 試算表即後台】而且外校部署後完全不用怕沒人維護！這四個網站全部採用「試算表即後台」架構：無論是匯入段考成績名冊、改管理密碼、貼上 Gemini API Key、改社團名額或作業規準，老師可以直接在網頁或 Google 試算表維護，連儲存格自動換列與最適欄寬都支援一鍵整理！", "html": "<section style=\"--k:#8B7CF6\"><div class=\"row\" style=\"gap:44px\"><div class=\"grow\"><h1 class=\"h\" style=\"font-size:90px\"><small>四大系統一致採用 Spreadsheet-as-CMS</small>會用試算表，<br>就會管系統後台！</h1><ul class=\"bl\" style=\"font-size:42px;margin-top:24px\"><li><b>名冊、成績、金鑰雙向同步</b>：試算表直接維護</li><li><b>一鍵自動換列與最適欄寬</b>：試算表永遠整齊好讀</li><li><b>資料 100% 存各校雲端</b>：徹底消除跨校個資疑慮</li></ul></div><div class=\"gsheet\"><div class=\"gs-top\">📊 〇〇國中_四大校務系統雲端後台試算表.xlsx</div><div class=\"gs-menu\"><span>🏫 校務系統設定 ▾</span><span>學生/導師名單</span><span>成績/社團/會議主表</span><div class=\"gs-drop\"><div>⚡ 一鍵初始化工作表與範例資料 ✔</div><div class=\"active\">🛡️ 千輪加鹽 SHA-256 密碼防護 ✔</div><div>📐 一鍵自動換列與最適欄寬 ✔</div></div></div><table class=\"gs-grid\"><tr><th>A 系統參數</th><th>B 外校設定值（雙向同步）</th><th>C 狀態</th></tr><tr><td>學校名稱</td><td class=\"edit\">桃園市立 〇〇國民中學 ✎</td><td>🟢 全站同步</td></tr><tr><td>排名顯示規範</td><td>教育部 5人/10人 序位區間</td><td>🏛️ 法規合規</td></tr><tr><td>資料儲存區</td><td>貴校自有 Google Drive</td><td>🔒 獨立隔離</td></tr></table></div></div><div class=\"tag\">三、跨校複製與 Skill</div><div class=\"pg\">17</div></section>"}, {"id": 18, "title": "確定分享之六大網站 × GitHub / Skill 總表", "layout": "六大網站完整清單總表（可點擊）", "notes": "【4:25-4:40 六大網站分享總表】這張總表完整列出了我們確定分享給全桃園各校的「六大網站」：前兩套遊戲（質因數防衛戰、DDP 知識對決）源自瓦特老師與鍾元杰老師的研習啟發，提供網址即點即玩與 GitHub 原始碼；後四套校務與教學系統（校園智慧行事曆、二合一學習能量軌跡、歷屆段考成績查詢系統、AI 智慧社團選社）則提供正式網址與專屬 AI Skill 倉庫，全部 12 個網址皆已實測 100% 暢通！", "html": "<section style=\"--k:#F59E0B\"><h1 class=\"h\" style=\"font-size:76px\"><small>全部 12 個網址均已實測暢通（點擊表格連結可直接開啟）</small>確定分享六大網站 × GitHub / Skill 總覽</h1><table class=\"stbl\" style=\"margin-top:16px;font-size:26px\"><tr><th>#</th><th>網站名稱與演進重點</th><th>想法源自 / 開發定位</th><th>正式網站網址 (GitHub Pages)</th><th function ctx(){if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();sfxGain=ac.createGain();sfxGain.gain.value=.8;sfxGain.connect(ac.destination);bgmLP=ac.createBiquadFilter();bgmLP.type='lowpass';bgmLP.frequency.value=4500;bgmGain=ac.createGain();bgmGain.gain.value=bgmVol;bgmGain.connect(bgmLP);bgmLP.connect(ac.destination)}if(ac.state!=='running')ac.resume();return ac}
const sfxCache={};
function sfx(name,delay=0){if(!sfxOn||!ac)return;const p=SFX[name];if(!p)return;let b=sfxCache[name];if(!b){const d=zzfxG(ac.sampleRate,...p);b=sfxCache[name]=ac.createBuffer(1,d.length,ac.sampleRate);b.getChannelData(0).set(d)}const s=ac.createBufferSource();s.buffer=b;s.connect(sfxGain);s.start(ac.currentTime+delay/1000)}
function bgmBuf(i){if(bgmBufs[i])return bgmBufs[i];const [L,R]=zzfxMRender(BGM[i].song,ac.sampleRate);let q=0,pk=0;for(let k=0;k<L.length;k++){q+=L[k]*L[k]+R[k]*R[k];pk=Math.max(pk,Math.abs(L[k]),Math.abs(R[k]))}const rms=Math.sqrt(q/L.length/2);let g=.1/rms;if(pk*g>.95)g=.95/pk;const b=ac.createBuffer(2,L.length,ac.sampleRate);const l=b.getChannelData(0),r=b.getChannelData(1);for(let k=0;k<L.length;k++){l[k]=L[k]*g;r[k]=R[k]*g}return bgmBufs[i]=b}
function toast(t){const e=$('#toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,2600)}
function bgmPlay(i){if(!ac||!bgmOn)return;if(i===bgmIdx&&bgmSrc)return;const old=bgmSrc;bgmIdx=i;const g=ac.createGain();g.gain.value=0;g.connect(bgmGain);const s=ac.createBufferSource();s.buffer=bgmBuf(i);s.loop=true;s.connect(g);s.start();const t=ac.currentTime;g.gain.linearRampToValueAtTime(1,t+1.2);if(old){old._g.gain.setValueAtTime(old._g.gain.value,t);old._g.gain.linearRampToValueAtTime(0,t+1.2);old.stop(t+1.3)}s._g=g;bgmSrc=s;toast('♪ '+BGM[i].name)}
function bgmStop(){if(bgmSrc){const t=ac.currentTime;bgmSrc._g.gain.linearRampToValueAtTime(0,t+.6);bgmSrc.stop(t+.7);bgmSrc=null;bgmIdx=-1}}
function bgmFollow(){if(bgmOn)bgmPlay(PARTS[partOf(cur)].bgm)}
function setS(v,quiet){sfxOn=v;store.set('sfx',v);$('#bS').classList.toggle('on',v);if(v){ctx();if(!quiet){sfx('on');toast('🔊 翻頁音效已開啟')}};if(!v&&!quiet)toast('🔇 翻頁音效已關閉')}
function setM(v){bgmOn=v;store.set('bgm',v);$('#bM').classList.toggle('on',v);if(v){ctx();toast('♪ 背景音樂準備中…');setTimeout(bgmFollow,30)}else if(ac){bgmStop();toast('🔇 背景音樂已關閉')}}
function vol(d){bgmVol=Math.max(.02,Math.min(1.2,bgmVol*(d>0?1.41:1/1.41)));store.set('bgmvol_v1',bgmVol);if(bgmGain)bgmGain.gain.value=bgmVol;toast('背景音樂音量 '+(20*Math.log10(bgmVol/.3)).toFixed(0)+' dB')}
const wake=()=>{removeEventListener('pointerdown',wake);removeEventListener('keydown',wake);if(store.get('sfx',true))setS(true,true);if(store.get('bgm',false))setM(true)};
addEventListener('pointerdown',wake);addEventListener('keydown',wake);

const at=(a,t,cb)=>{(function f(){(a.currentTime||0)>=t?cb():requestAnimationFrame(f)})()};
const A=(el,kf,o)=>el.animate(kf,Object.assign({fill:'both',easing:'cubic-bezier(.6,0,.3,1)'},o));
const MASKS={
 clap(dir,onSwap){const m=$('#mClap'),t=m.querySelector('.ct'),b=m.querySelector('.cb');m.style.display='block';const D=1000;sfx('clap',380);sfx('clapw',395);
   const a=A(t,[{transform:'translateY(-105%) rotate(-14deg)'},{transform:'translateY(0) rotate(-14deg)',offset:.3},{transform:'translateY(0) rotate(0)',offset:.4},{transform:'translateY(0) rotate(0)',offset:.62},{transform:'translateY(-105%) rotate(0)'}],{duration:D});
   const a2=A(b,[{transform:'translateY(105%)'},{transform:'translateY(0)',offset:.3},{transform:'translateY(0)',offset:.62},{transform:'translateY(105%)'}],{duration:D});
   at(a,D*.51,onSwap);return a.finished.then(()=>{a.cancel();a2.cancel();m.style.display='none'})},
 cut(dir,onSwap){const m=$('#mCut');m.style.display='block';const s=dir>0?1:-1,D=1000;sfx('whir');sfx('snip1',430);sfx('snip2',500);
   const a=A(m,[{transform:`translateX(${-110*s}%)`},{transform:'translateX(0)',offset:.42},{transform:'translateX(0)',offset:.6},{transform:`translateX(${110*s}%)`}],{duration:D});at(a,D*.51,onSwap);return a.finished.then(()=>{a.cancel();m.style.display='none'})},
 rec(dir,onSwap){const m=$('#mRec');m.innerHTML='<span></span><i></i>';m.style.display='block';const D=1100;sfx('shut');sfx('rec',500);
   const a=A(m,[{transform:'translate(-50%,-50%) scale(.04)',opacity:1},{transform:'translate(-50%,-50%) scale(1)',offset:.4},{transform:'translate(-50%,-50%) scale(1)',offset:.66,opacity:1},{transform:`translate(-50%,-50%) scale(1.15) rotate(${dir>0?30:-30}deg)`,opacity:0}],{duration:D});at(a,D*.53,onSwap);return a.finished.then(()=>{a.cancel();m.style.display='none'})},
};
function act(kind,newL,oldL,dir,withSound=true){
  const D=reduce?250:700;
  if(reduce||kind==='fade'){return A(newL,[{opacity:0},{opacity:1}],{duration:D}).finished}
  if(kind==='zoom'){withSound&&sfx('zoom');A(oldL,[{opacity:1},{opacity:0}],{duration:D});return A(newL,[{opacity:0,transform:'scale(1.05)',filter:'blur(10px)'},{opacity:1,transform:'scale(1)',filter:'blur(0)'}],{duration:D}).finished}
  if(kind==='push'){withSound&&sfx('push');const s=dir>0?1:-1;A(oldL,[{transform:'translateX(0)'},{transform:`translateX(${-100*s}%)`}],{duration:D});return A(newL,[{transform:`translateX(${100*s}%)`},{transform:'translateX(0)'}],{duration:D}).finished}
  if(kind==='iris'){withSound&&sfx('iris');return A(newL,[{clipPath:'circle(0% at 50% 50%)'},{clipPath:'circle(75% at 50% 50%)'}],{duration:D}).finished}
  return Promise.resolve();
}
function trFor(from,to){const sel=$('#trSel').value;if(sel!=='auto')return sel.split('+');const k=to>from?to:from;return (PLAN[k]||['zoom'])}
function go(i,dirHint){
  if(busy||i<0||i>=SLIDES.length||i===cur)return;
  busy=true;const dir=dirHint||(i>cur?1:-1);const kinds=trFor(cur,i);
  const oldL=layers[front],newL=layers[1-front];fill(newL,i);fit();
  newL.style.zIndex=2;oldL.style.zIndex=1;newL.style.visibility='hidden';
  const finish=()=>{oldL.style.visibility='hidden';newL.getAnimations().forEach(a=>a.cancel());oldL.getAnimations().forEach(a=>a.cancel());oldL.style.transform='';front=1-front;cur=i;busy=false;ui()};
  const swap=(rest)=>{newL.style.visibility='visible';const p=rest.length?Promise.all(rest.map(k=>act(k,newL,oldL,dir))):Promise.resolve();return p};
  if(MASKS[kinds[0]]&&!reduce){let sw;const sp=new Promise(r=>sw=r);MASKS[kinds[0]](dir,()=>{swap(kinds.slice(1)).then(sw)});Promise.all([sp]).then(()=>setTimeout(finish,40))}
  else{const k=MASKS[kinds[0]]?['fade']:kinds;newL.style.visibility='visible';Promise.all(k.map(x=>act(x,newL,oldL,dir))).then(finish)}
  cur=i;updateBar(i);
}
function updateBar(i){$('#count').textContent=(i+1)+' / '+SLIDES.length;$('#progFill').style.width=((i+1)/SLIDES.length*100)+'%'}
function ui(){updateBar(cur);(()=>{try{history.replaceState(null,'','#p'+(cur+1))}catch(e){}})();$('#notes').innerHTML='<b>第 '+(cur+1)+' 頁｜'+SLIDES[cur].layout+'</b><br>'+SLIDES[cur].notes;bgmFollow();document.querySelectorAll('#ov figure').forEach((f,k)=>f.classList.toggle('cur',k===cur))}

PARTS.forEach(p=>{const m=document.createElement('div');m.className='cm';m.style.left=(p.start/SLIDES.length*100)+'%';m.title=p.name;$('#prog').appendChild(m)});
$('#prog').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();go(Math.min(SLIDES.length-1,Math.floor((e.clientX-r.left)/r.width*SLIDES.length)))};

function buildOv(){const ov=$('#ov');let h='<div class="gt"><span>📑 簡報章節總覽（共 '+SLIDES.length+' 頁，點選任一頁直接跳轉）</span><button onclick="toggleOv(false)" style="background:#ef4444;color:#fff;border:0;padding:6px 16px;border-radius:8px;cursor:pointer;font-size:16px">✕ 關閉 (Esc)</button></div>';PARTS.forEach((p,k)=>{const end=k+1<PARTS.length?PARTS[k+1].start:SLIDES.length;h+=`<div class="ph" style="--k:${p.color}">${p.name}</div><div class="grid">`;for(let i=p.start;i<end;i++)h+=`<figure data-i="${i}"><div class="th"><div class="sl">${SLIDES[i].html}</div></div><figcaption>${i+1}. ${SLIDES[i].title}</figcaption></figure>`;h+='</div>'});ov.innerHTML=h;ov.querySelectorAll('figure').forEach(f=>f.onclick=()=>{toggleOv(false);go(+f.dataset.i)})}
function scaleOv(){document.querySelectorAll('#ov .th').forEach(t=>t.firstChild.style.transform=`scale(${t.clientWidth/1920})`)}
function toggleOv(v){const ov=$('#ov');v=v===undefined?ov.style.display!=='block':v;if(v&&!ov.innerHTML)buildOv();ov.style.display=v?'block':'none';if(v){scaleOv();ui()}}
addEventListener('resize',()=>{if($('#ov').style.display==='block')scaleOv()});
function toggleNotes(){const n=$('#notes');const show=n.style.display!=='block';n.style.display=show?'block':'none';$('#bN').classList.toggle('on',show)}
function fs(){if(!document.fullscreenElement)document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen()}
$('#bPrev').onclick=()=>go(cur-1);$('#bNext').onclick=()=>go(cur+1);
$('#bS').onclick=()=>setS(!sfxOn);$('#bM').onclick=()=>setM(!bgmOn);$('#bG').onclick=()=>toggleOv();$('#bN').onclick=toggleNotes;$('#bF').onclick=fs;
$('#trSel').value=store.get('tr','auto');$('#trSel').onchange=e=>{store.set('tr',e.target.value);e.target.blur()};
function setTheme(th){document.documentElement.setAttribute('data-theme',th);store.set('theme',th);$('#themeSel').value=th}
setTheme(store.get('theme','teal'));
$('#themeSel').onchange=e=>{setTheme(e.target.value);toast('🎨 已切換配色：'+e.target.options[e.target.selectedIndex].text);e.target.blur()};
addEventListener('keydown',e=>{if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return;const k=e.key;
 if(k==='ArrowRight'||k===' '||k==='PageDown'){e.preventDefault();go(cur+1)}else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();go(cur-1)}
 else if(k==='Home')go(0);else if(k==='End')go(SLIDES.length-1);
 else if(k==='s'||k==='S')setS(!sfxOn);else if(k==='m'||k==='M')setM(!bgmOn);else if(k==='g'||k==='G')toggleOv();else if(k==='Escape')toggleOv(false);
 else if(k==='n'||k==='N')toggleNotes();else if(k==='f'||k==='F')fs();else if(k===']')vol(1);else if(k==='[')vol(-1)});
stage.addEventListener('click',e=>{if(e.target.closest('a,button'))return;const r=stage.getBoundingClientRect();go(e.clientX-r.left<r.width*.3?cur-1:cur+1)});
let tx=null;stage.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});stage.addEventListener('touchend',e=>{if(tx===null)return;const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)go(cur+(d<0?1:-1));tx=null},{passive:true});

const m0=location.hash.match(/^#p(\d+)/);cur=m0?Math.min(SLIDES.length-1,Math.max(0,m0[1]-1)):0;
fill(layers[0],cur);layers[1].style.visibility='hidden';fit();ui();
</script>
</body>
</html>
